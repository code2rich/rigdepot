#
# rgd-server with Docker Compose: one container, SQLite in one volume. Copy
# .env.example to .env and set RGD_BASE_URL first.
#
#   docker compose up -d
#
# PostgreSQL instead of SQLite: add compose.postgres.yaml (see README.md):
#
#   docker compose -f compose.yaml -f compose.postgres.yaml up -d
#
# The server only listens on this machine. Put a reverse proxy that
# terminates HTTPS in front of it (proxy/ has samples for Caddy and nginx).

name: rigdepot

services:
  rigdepot:
    # Pin the full version in production, for example RGD_VERSION=0.4.0.
    image: ghcr.io/code2rich/rigdepot-server:${RGD_VERSION:-latest}
    # Without a published image, or to try a change, build it from this
    # checkout instead: docker compose build
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    # Everything the server writes is in the data volume; git works in /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${RGD_PORT:-8080}:8080"
    environment:
      RGD_BASE_URL: ${RGD_BASE_URL:?set RGD_BASE_URL in .env to the public address of this server, such as https://hub.example.com}
      # Who may set X-Forwarded-For: by default the address range of this
      # project's network (below). Requests from the reverse proxy on this
      # machine arrive from that network's gateway, so this is the proxy and
      # nothing else that can reach the container. Setting it also tells the
      # server it is behind a proxy that terminates HTTPS; without it, the
      # server refuses to listen on the container's network without TLS.
      RGD_TRUSTED_PROXIES: ${RGD_TRUSTED_PROXIES:-${RGD_SUBNET:-172.31.250.0/24}}
    volumes:
      # Everything that needs a backup is in here: the SQLite database and the
      # master key.
      - rigdepot-data:/var/lib/rigdepot

networks:
  default:
    ipam:
      config:
        # Fixed, so that RGD_TRUSTED_PROXIES can name it. Change RGD_SUBNET if
        # it overlaps a network you already have.
        - subnet: ${RGD_SUBNET:-172.31.250.0/24}

volumes:
  rigdepot-data:
