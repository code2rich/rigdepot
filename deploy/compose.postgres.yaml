#
# PostgreSQL instead of SQLite, on top of compose.yaml:
#
#   docker compose -f compose.yaml -f compose.postgres.yaml up -d
#
# or set COMPOSE_FILE=compose.yaml:compose.postgres.yaml in .env and run
# docker compose up -d. It needs two files in secrets/, described in
# README.md: the database password, and the connection URL that contains it.
#
# The data volume of compose.yaml is still needed: it holds the master key and
# the repository cache.

services:
  rigdepot:
    environment:
      RGD_DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - database_url
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: rigdepot
      POSTGRES_DB: rigdepot
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rigdepot -d rigdepot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url
