#
# nginx in front of rgd-server. Put this file into /etc/nginx/conf.d/ and set
# the certificate paths. nginx terminates HTTPS; rgd-server listens on
# 127.0.0.1:8080.
#
# rgd-server believes X-Forwarded-For only from RGD_TRUSTED_PROXIES: 127.0.0.1
# when it runs on this machine without containers, the project's network
# (RGD_SUBNET) with deploy/compose.yaml.

server {
    listen 80;
    listen [::]:80;
    server_name hub.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hub.example.com;

    ssl_certificate     /etc/nginx/tls/hub.example.com.crt;
    ssl_certificate_key /etc/nginx/tls/hub.example.com.key;

    # Resource bundles are at most RGD_MAX_BUNDLE_MB (5 MB by default).
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Uploads go straight through instead of being buffered to disk first.
        proxy_request_buffering off;
    }
}
