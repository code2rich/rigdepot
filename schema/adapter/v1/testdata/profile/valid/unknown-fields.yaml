id: claude-code
name: Claude Code
homepage: https://claude.com/product/claude-code
detect:
  bins: [claude]
  timeoutSeconds: 5
roots:
  config: { env: CLAUDE_CONFIG_DIR, default: "~/.claude", x-note: the state file sits next to it }
verified:
  version: "2.1.330"
  os: [darwin]
  at: 2026-11-24
  how: ran claude mcp add --scope user in a temporary home directory and read the file
  by: release-bot
skills: { dir: "{config}/skills", layout: dir }
hooks: { file: "{config}/settings.json", format: json, path: [hooks], optIn: true }
