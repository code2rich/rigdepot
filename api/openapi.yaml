  # ---------------------------------------------------------------- device
  /api/v1/device/code:
    post:
      operationId: requestDeviceCode
      summary: Start `rgd login` (RFC 8628 device authorization)
      description: |
        The command line generates its key pair first and sends the public
        key along; the device record, its token and the key are bound
        together once the person approves in the browser. Rate-limited per
        source address.
      tags: [device]
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceCodeRequest' }
            example:
              name: dev-laptop
              os: darwin
              arch: arm64
              cli_version: 0.5.0
              public_key: 3q2-7wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
              key_storage: keyring
      responses:
        '200':
          description: Show `user_code` and open `verification_uri_complete`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceCode' }
              example:
                device_code: '<placeholder: device code, known only to the command line>'
                user_code: KQ7M-2XHP
                verification_uri: https://hub.example.com/device
                verification_uri_complete: https://hub.example.com/device?code=KQ7M-2XHP
                expires_in: 600
                interval: 5
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/device/token:
    post:
      operationId: pollDeviceToken
      summary: Poll for the device token
      description: |
        Until the person decides, the answer is `400` with code
        `device.authorization_pending`. Polling faster than `interval` is
        `400 device.slow_down` (with the new interval in `params.interval`).
        Expired or used codes are `400 device.expired`; a refusal is
        `400 device.denied`. The status follows RFC 8628; the body is this
        API's usual problem document.
      tags: [device]
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceTokenRequest' }
            example: { device_code: '<placeholder: device code>' }
      responses:
        '200':
          description: Approved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceToken' }
              example:
                device_token: '<placeholder: rgdd_ token>'
                device_id: 0193a4b2-6c1e-7a00-8000-000000000201
                user: { id: 0193a4b2-6c1e-7a00-8000-000000000011, username: jdoe, display_name: Jamie Doe }
        '400':
          description: Not yet, too fast, expired or denied.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: about:blank, title: Bad Request, status: 400, code: device.authorization_pending, detail: Waiting for confirmation in the browser., request_id: 01JDV6ZQ8M3K }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/device/requests/{user_code}:
    get:
      operationId: getDeviceRequest
      summary: What the confirmation page shows
      description: Only from a signed-in browser. The person compares the code and the computer with what their terminal shows.
      tags: [device]
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/UserCode' }
      responses:
        '200':
          description: A pending request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceRequest' }
              example:
                user_code: KQ7M-2XHP
                name: dev-laptop
                os: darwin
                arch: arm64
                cli_version: 0.5.0
                status: pending
                requested_at: '2026-11-25T10:12:00Z'
                expires_at: '2026-11-25T10:22:00Z'
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/device/requests/{user_code}/approve:
    post:
      operationId: approveDeviceRequest
      summary: Let this computer sign in as me
      description: Creates the device and its token; audited as "sign-in, command line, device code". Only from a signed-in browser.
      tags: [device]
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/UserCode' }
      responses:
        '204': { description: Approved; the command line picks up its token at the next poll. }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/device/requests/{user_code}/deny:
    post:
      operationId: denyDeviceRequest
      summary: Refuse a sign-in request
      tags: [device]
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/UserCode' }
      responses:
        '204': { description: Refused. }
        default: { $ref: '#/components/responses/Problem' }

  # --------------------------------------------------------------- catalog
  /api/v1/catalog:
    get:
      operationId: listCatalog
      summary: Published resources I can see
      description: |
        Everything published in the organisation scope and in the products I
        belong to, with whether it is on for me. Filtering happens on the
        server; the whole visible catalog fits in one response.
      tags: [catalog]
      security: [{ session: [] }, { device: [] }, { accessToken: [] }]
      x-token-scope: read
      parameters:
        - { $ref: '#/components/parameters/KindFilter' }
        - { name: stage, in: query, description: Only resources in this stage., schema: { $ref: '#/components/schemas/StageId' } }
        - { name: audience, in: query, schema: { $ref: '#/components/schemas/Audience' } }
        - { name: q, in: query, description: 'Matches name, code and summary, case-insensitively.', schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: The visible catalog, by name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogList' }
              example:
                items:
                  - code: unit-testing
                    kind: skill
                    name: Unit testing
                    summary: Writes and runs unit tests for a change, covering edge cases.
                    stages: [test]
                    audience: rd
                    scope: org
                    policy: recommended
                    origin: repo
                    version: 4
                    enabled: true
                    installed_people: 58
                  - code: jira
                    kind: mcp
                    name: Jira
                    summary: Reads and writes issues and sprints.
                    stages: [requirement, develop, test]
                    audience: rd
                    scope: org
                    policy: required
                    origin: web
                    version: 4
                    enabled: true
                    installed_people: 142
                    secrets: [{ name: JIRA_API_TOKEN, configured: true }]
                    delivery: native
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/catalog/{code}:
    get:
      operationId: getCatalogResource
      summary: One published resource in detail
      tags: [catalog]
      security: [{ session: [] }, { device: [] }, { accessToken: [] }]
      x-token-scope: read
      parameters:
        - { $ref: '#/components/parameters/ResourceCode' }
      responses:
        '200':
          description: The live version, its files, what it needs, and where it is installed on my computers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogResource' }
              example:
                code: unit-testing
                kind: skill
                name: Unit testing
                summary: Writes and runs unit tests for a change, covering edge cases.
                stages: [test]
                audience: rd
                scope: org
                policy: recommended
                origin: repo
                version: 4
                enabled: true
                installed_people: 58
                when: When a change needs unit tests
                try: Add unit tests for the classes I just changed
                maintainers: [{ id: 0193a4b2-6c1e-7a00-8000-000000000013, username: gyuan, display_name: Gu Yuan }]
                digest: sha256:4f9a5c0d7e2b1a3c6d8e0f2a4b6c8d0e1f3a5b7c9d1e3f5a7b9c1d3e5f7a9b1c
                published_at: '2026-11-03T08:00:00Z'
                files:
                  - { path: SKILL.md, size: 1840 }
                  - { path: references/checklist.md, size: 512 }
                definition: {}
                references: []
                referenced_by: [{ code: task-to-submit, kind: workflow, name: From task to submission }]
                local_config: [{ name: JAVA8_HOME, description: 'Where Java 8 is installed, for old projects' }]
                my_installs:
                  - { device_id: 0193a4b2-6c1e-7a00-8000-000000000201, device_name: dev-laptop, tool: claude-code, version: 4, status: installed, degraded: false }
                  - { device_id: 0193a4b2-6c1e-7a00-8000-000000000201, device_name: dev-laptop, tool: codex, version: 4, status: installed, degraded: false }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/catalog/{code}/file:
    get:
      operationId: getCatalogFile
      summary: One file of a published version
      tags: [catalog]
      security: [{ session: [] }, { device: [] }, { accessToken: [] }]
      x-token-scope: read
      parameters:
        - { $ref: '#/components/parameters/ResourceCode' }
        - { $ref: '#/components/parameters/FilePath' }
        - name: version
          in: query
          description: A published version number. Defaults to the live version.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The file's bytes. Text files are UTF-8.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
              example: "---\nname: unit-testing\ndescription: Writes and runs unit tests for a change.\n---\n"
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/catalog/{code}/preference:
    put:
      operationId: setCatalogPreference
      summary: Turn a resource on or off for myself
      description: |
        Applies to all my computers from their next sync. An optional
        resource has to be turned on; a recommended one can be turned off; a
        required one cannot (`409 resource.required`). `rgd enable` and
        `rgd disable` call this when signed in.
      tags: [catalog]
      parameters:
        - { $ref: '#/components/parameters/ResourceCode' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreferenceRequest' }
            example: { enabled: false }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preference' }
              example: { code: unit-testing, enabled: false, policy: recommended }
        '409':
          description: A required resource cannot be turned off (`resource.required`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: about:blank, title: Conflict, status: 409, code: resource.required, detail: Jira is required in your scope and cannot be turned off., params: { code: jira }, request_id: 01JDV6ZQ8M3K }
        default: { $ref: '#/components/responses/Problem' }

  # ------------------------------------------------------------------ sync
  /api/v1/sync/desired:
    get:
      operationId: getDesiredState
      summary: What this person's computer should have
      description: |
        Everything the caller should have installed, at which version, and
        why: the policy, their own choice, or because another resource needs
        it. Includes the organisation's defaults the command line has to
        respect and the command-line versions the server accepts. The ETag
        changes whenever any of it changes; send it back in `If-None-Match`.
      tags: [sync]
      security: [{ device: [] }, { accessToken: [] }]
      x-token-scope: read
      parameters:
        - { $ref: '#/components/parameters/IfNoneMatch' }
      responses:
        '200':
          description: The desired state.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesiredState' }
              example:
                generated_at: '2026-11-25T10:30:00Z'
                user: { id: 0193a4b2-6c1e-7a00-8000-000000000011, username: jdoe, display_name: Jamie Doe }
                cli: { min_version: 0.4.0, latest_version: 0.5.0 }
                defaults: { tools_disabled: [], mcp_mode: single-entry }
                resources:
                  - code: unit-testing
                    kind: skill
                    version: 4
                    digest: sha256:4f9a5c0d7e2b1a3c6d8e0f2a4b6c8d0e1f3a5b7c9d1e3f5a7b9c1d3e5f7a9b1c
                    bundle: sha256:9b1c4f9a5c0d7e2b1a3c6d8e0f2a4b6c8d0e1f3a5b7c9d1e3f5a7b9c1d3e5f7a
                    size: 4096
                    reason: policy
                    meta: { name: Unit testing, stages: [test], audience: rd, scope: org, policy: recommended, when: When a change needs unit tests }
                  - code: jira
                    kind: mcp
                    version: 4
                    digest: sha256:0e1f3a5b7c9d1e3f5a7b9c1d3e5f7a9b1c4f9a5c0d7e2b1a3c6d8e0f2a4b6c8d
                    bundle: sha256:1e3f5a7b9c1d3e5f7a9b1c4f9a5c0d7e2b1a3c6d8e0f2a4b6c8d0e1f3a5b7c9d
                    size: 812
                    reason: policy
                    delivery: native
                    meta: { name: Jira, stages: [requirement, develop, test], audience: rd, scope: org, policy: required, secrets: [JIRA_API_TOKEN] }
                secrets:
                  - { name: JIRA_API_TOKEN, configured: true, version: 3 }
        '304':
          description: Nothing changed since the ETag in `If-None-Match`.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/sync/bundles/{digest}:
    get:
      operationId: getBundle
      summary: Download a resource bundle
      description: |
        A deterministic tar archive, addressed by the SHA-256 of its own
        bytes; the command line checks the digest before using it. Only
        bundles of versions visible to the caller can be fetched. Immutable:
        cache forever.
      tags: [sync]
      security: [{ device: [] }, { accessToken: [] }]
      x-token-scope: read
      parameters:
        - name: digest
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Digest' }
      responses:
        '200':
          description: The bundle.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/x-tar:
              schema: { type: string, format: binary }
              example: '<tar archive>'
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/sync/secrets:
    post:
      operationId: getSealedSecrets
      summary: My secrets, sealed to this computer's public key
      description: |
        Each value is re-encrypted for the calling device with HPKE
        (RFC 9180: DHKEM(X25519, HKDF-SHA256), HKDF-SHA256, AES-256-GCM); the
        `info` binds user, device, secret name and version. The command line
        stores what it gets as it is and opens a value only at the moment an
        MCP server needs it. A POST because the answer is specific to the
        device and must never be cached. Device tokens only.
      tags: [sync]
      security: [{ device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SealedSecretsRequest' }
            example: { names: [JIRA_API_TOKEN] }
      responses:
        '200':
          description: The sealed values. Secrets that are not configured are listed in `missing`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SealedSecrets' }
              example:
                device_id: 0193a4b2-6c1e-7a00-8000-000000000201
                suite: hpke-x25519-sha256-aes256gcm
                items:
                  - name: JIRA_API_TOKEN
                    version: 3
                    enc: BASE64ENCAPSULATEDKEYxxxxxxxxxxxxxxxxxxxxxxx
                    ciphertext: BASE64CIPHERTEXTxxxxxxxxxxxxxxxxxxxxxxxxxxxx
                    info: rgd/secret/v1|0193a4b2-6c1e-7a00-8000-000000000011|0193a4b2-6c1e-7a00-8000-000000000201|JIRA_API_TOKEN|3
                    expires_at: '2026-11-30T00:00:00Z'
                missing: []
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/sync/report:
    post:
      operationId: reportSync
      summary: Report what a sync did on this computer
      description: |
        Which resource, which version, which tool, and whether it worked.
        Never a file path or file content. Device tokens only.
      tags: [sync]
      security: [{ device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncReport' }
            example:
              cli_version: 0.5.0
              os: darwin
              arch: arm64
              finished_at: '2026-11-25T10:31:00Z'
              result: partial
              tools:
                - { tool: claude-code, version: 2.1.330 }
                - { tool: codex, version: 0.167.1 }
              installs:
                - { code: unit-testing, version: 4, tool: claude-code, status: installed }
                - { code: task-to-submit, version: 3, tool: codex, status: installed, degraded: true, form: skill }
                - { code: figma, version: 2, tool: claude-code, status: skipped, reason: secret_missing }
      responses:
        '204': { description: Recorded. }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/installs/summary:
    get:
      operationId: getInstallsSummary
      summary: How far the organisation has connected
      description: |
        Built from the reports above. Platform administrators see the whole
        organisation; product owners see their products (`product` narrows
        it down). The home page's "standard flow" figure and the tool
        adapters page come from here.
      tags: [sync]
      parameters:
        - { name: product, in: query, schema: { $ref: '#/components/schemas/ProductCode' } }
      responses:
        '200':
          description: The figures.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstallsSummary' }
              example:
                people_connected: 179
                devices_active: 231
                required_complete: { people: 154, of: 179 }
                by_tool: [{ tool: claude-code, people: 164 }, { tool: codex, people: 71 }, { tool: opencode, people: 23 }]
                cli_versions: [{ version: 0.5.0, people: 171 }, { version: 0.4.2, people: 16 }]
        default: { $ref: '#/components/responses/Problem' }

  # ------------------------------------------------------------- resources
  /api/v1/resources:
    get:
      operationId: listResources
      summary: Resources I manage
      description: |
        Drafts included. Platform administrators see everything; product
        owners their products' resources; maintainers what they maintain.
      tags: [resources]
      security: [{ session: [] }, { device: [] }, { accessToken: [] }]
      x-token-scope: publish
      parameters:
        - { $ref: '#/components/parameters/KindFilter' }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ResourceStatus' } }
        - { name: pending, in: query, description: Only resources with a draft waiting to be published., schema: { type: boolean } }
        - { name: blocked, in: query, description: Only resources whose draft or live version fails a must-fix check., schema: { type: boolean } }
        - { name: scope, in: query, schema: { $ref: '#/components/schemas/Scope' } }
        - { name: source, in: query, description: Only resources imported from this source., schema: { $ref: '#/components/schemas/Id' } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: By name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceList' }
              example:
                items:
                  - code: design-doc
                    kind: skill
                    name: Design document
                    stages: [design]
                    audience: rd
                    scope: org
                    policy: recommended
                    origin: repo
                    status: published
                    version: 9
                    has_draft: true
                    checks: { blocking: 0, advisory: 2 }
                    updated_at: '2026-11-25T08:30:00Z'
                  - code: shop-config-check
                    kind: skill
                    name: Config check
                    stages: []
                    audience: rd
                    scope: shop
                    policy: optional
                    origin: upload
                    status: draft
                    has_draft: true
                    checks: { blocking: 2, advisory: 1 }
                    updated_at: '2026-11-20T15:02:00Z'
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/resources/{code}:
    get:
      operationId: getResource
      summary: A resource as its managers see it
      tags: [resources]
      security: [{ session: [] }, { device: [] }, { accessToken: [] }]
      x-token-scope: publish
      parameters:
        - { $ref: '#/components/parameters/ResourceCode' }
      responses:
        '200':
          description: The resource. Its ETag guards settings changes, rollback, disabling and enabling.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedResource' }
              examples: { published: { $ref: '#/components/examples/ManagedResource' } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateResource
      summary: Change who gets a resource and how
      description: |
        Scope, policy, audience, stages and the descriptive fields. Takes
        effect at once, without a new version: content does not change. A
        field changed here becomes a platform override and is listed in
        `overrides`; later changes to that field in the repository are
        reported but not applied, until the override is dropped with
        `reset`. Narrowing the scope or disabling affects people: look at
        `/impact` first.
      tags: [resources]
      parameters:
        - { $ref: '#/components/parameters/ResourceCode' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateResourceRequest' }
            example: { policy: required, scope: shop }
      responses:
        '200':
          description: The updated resource.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedResource' }
              examples: { published: { $ref: '#/components/examples/ManagedResource' } }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/resources/{code}/draft:
    get:
      operationId: getDraft
      summary: The draft waiting to be published
      tags: [resources]
      security: [{ session: [] }, { device: [] }, { accessToken: [] }]
      x-token-scope: publish
      parameters:
        - { $ref: '#/components/parameters/ResourceCode' }
      responses:
        '200':
          description: The draft with its check results. Its ETag is what `publish` needs in `If-Match`.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
              examples: { imported: { $ref: '#/components/examples/Draft' } }
        default: { $ref: '#/components/responses/Problem' }
    put:
      operationId: putDraft
      summary: Register a resource on the web, or replace its draft
      description: |
        For kinds whose whole content is one document: an MCP server, a
        knowledge pointer. The definition is the kind's own document, as it
        would be in the repository, with secrets written as
        `${secret:NAME}`; a plain-text secret is refused
        (`400 resource.plaintext_secret`). The first draft creates the
        resource (origin `web`). Resources imported from a repository are
        changed in the repository (`409 resource.from_repository`).

        When the resource already has a draft, `If-Match` with its ETag is
        required. Saving runs the same checks as an import.
      tags: [resources]
      security: [{ session: [] }, { device: [] }, { accessToken: [] }]
      x-token-scope: publish
      parameters:
        - { $ref: '#/components/parameters/ResourceCode' }
        - { $ref: '#/components/parameters/IfMatchOptional' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutDraftRequest' }
            example:
              kind: mcp
              meta: { name: Jira, summary: Reads and writes issues and sprints., stages: [requirement, develop, test], scope: org, policy: required, secrets: [JIRA_API_TOKEN] }
              definition:
                transport: http
                url: https://jira-mcp.example.com/mcp
                headers: { Authorization: 'Bearer ${secret:JIRA_API_TOKEN}' }
                delivery: native
      responses:
        '200':
          description: The draft was replaced.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
              examples: { imported: { $ref: '#/components/examples/Draft' } }
        '201':
          description: The resource was created with this draft.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
              examples: { imported: { $ref: '#/components/examples/Draft' } }
        '409':
          description: The resource comes from a repository (`resource.from_repository`) or is of another kind (`resource.kind_mismatch`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: about:blank, title: Conflict, status: 409, code: resource.from_repository, detail: This resource comes from a repository. Change it there., params: { source: harness-resources }, request_id: 01JDV6ZQ8M3K }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: discardDraft
      summary: Throw a draft away
      description: The live version stays. A resource that was never published disappears with its draft.
      tags: [resources]
      parameters:
        - { $ref: '#/components/parameters/ResourceCode' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '204': { description: Discarded. }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/resources/{code}/draft/bundle:
    put:
      operationId: uploadDraftBundle
      summary: Upload a resource's files as its new draft
      description: |
        The fallback for directory-shaped kinds (skill, agent, workflow) when
        they do not come from a repository: an archive of the resource's
        directory, at most `limits.max_bundle_bytes` (refused before it is
        read: `413`). Unpacking applies the same path-safety rules as an
        import (`400 bundle.unsafe_path`), then the same checks. `kind` is
        needed when the upload creates the resource. When the resource
        already has a draft, `If-Match` with its ETag is required.
      tags: [resources]
      security: [{ session: [] }, { device: [] }, { accessToken: [] }]
      x-token-scope: publish
      parameters:
        - { $ref: '#/components/parameters/ResourceCode' }
        - { $ref: '#/components/parameters/IfMatchOptional' }
        - name: kind
          in: query
          description: The kind, when this upload creates the resource.
          schema: { $ref: '#/components/schemas/Kind' }
      requestBody:
        required: true
        description: |
          A zip archive, a tar archive or a gzip-compressed tar archive of the
          resource's directory, told apart by its first bytes. Anything else
          is `415 bundle.unknown_format`.
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
            example: '<zip archive>'
      responses:
        '200':
          description: The draft was replaced.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
              examples: { imported: { $ref: '#/components/examples/Draft' } }
        '201':
          description: The resource was created with this draft.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
              examples: { imported: { $ref: '#/components/examples/Draft' } }
        '409':
          description: The resource comes from a repository (`resource.from_repository`) or is of another kind (`resource.kind_mismatch`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: about:blank, title: Conflict, status: 409, code: resource.kind_mismatch, detail: 'unit-testing is a skill, not an agent.', params: { kind: skill }, request_id: 01JDV6ZQ8M3K }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/resources/{code}/draft/file:
    get:
      operationId: getDraftFile
      summary: One file of the draft
      tags: [resources]
      security: [{ session: [] }, { device: [] }, { accessToken: [] }]
      x-token-scope: publish
      parameters:
        - { $ref: '#/components/parameters/ResourceCode' }
        - { $ref: '#/components/parameters/FilePath' }
      responses:
        '200':
          description: The file's bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
              example: "---\nname: design-doc\ndescription: Writes or updates the design document from the template.\n---\n"
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/resources/{code}/draft/diff:
    get:
      operationId: getDraftDiff
      summary: What the draft changes compared with the live version
      tags: [resources]
      parameters:
        - { $ref: '#/components/parameters/ResourceCode' }
      responses:
        '200':
          description: File by file; text files with a unified diff.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DraftDiff' }
              example:
                base_version: 9
                files:
                  - path: SKILL.md
                    change: modified
                    unified: "@@ -12,3 +12,4 @@\n ## Steps\n-1. Read the input\n+1. Read the input and the template\n+2. Check the design for open questions\n"
                  - { path: references/template.md, change: added }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/resources/{code}/publish:
    post:
      operationId: publishResource
      summary: Publish the draft as a new version
      description: |
        `If-Match` carries the draft ETag the person saw: if the draft
        changed since (a newer import, someone else's upload), the answer is
        `412` and nothing is published. A draft with a must-fix finding that
        is not waived is refused with `409 resource.check_blocked`.
        Publishing is one transaction: audit entry, new immutable version,
        live pointer, draft cleared.
      tags: [resources]
      security: [{ session: [] }, { device: [] }, { accessToken: [] }]
      x-token-scope: publish
      parameters:
        - { $ref: '#/components/parameters/ResourceCode' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishRequest' }
            example: { note: Covers the case of a missing template }
      responses:
        '201':
          description: Published.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceVersion' }
              examples: { published: { $ref: '#/components/examples/ResourceVersion' } }
        '409':
          description: A must-fix finding blocks it (`resource.check_blocked`), or there is no draft (`resource.no_draft`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: about:blank, title: Conflict, status: 409, code: resource.check_blocked, detail: 2 problems must be fixed before this can be published., params: { blocking: 2 }, request_id: 01JDV6ZQ8M3K }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/resources/{code}/versions:
    get:
      operationId: listResourceVersions
      summary: A resource's published versions
      tags: [resources]
      security: [{ session: [] }, { device: [] }, { accessToken: [] }]
      x-token-scope: publish
      parameters:
        - { $ref: '#/components/parameters/ResourceCode' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceVersionPage' }
              example:
                items:
                  - number: 9
                    digest: sha256:4f9a5c0d7e2b1a3c6d8e0f2a4b6c8d0e1f3a5b7c9d1e3f5a7b9c1d3e5f7a9b1c
                    bundle: sha256:9b1c4f9a5c0d7e2b1a3c6d8e0f2a4b6c8d0e1f3a5b7c9d1e3f5a7b9c1d3e5f7a
                    note: Covers the case of a missing template
                    source_commit: 3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a
                    ruleset: 1
                    checks: { blocking: 0, advisory: 2 }
                    published_by: { id: 0193a4b2-6c1e-7a00-8000-000000000013, username: gyuan, display_name: Gu Yuan }
                    published_at: '2026-11-25T10:02:00Z'
                  - number: 8
                    digest: sha256:7e2b1a3c6d8e0f2a4b6c8d0e1f3a5b7c9d1e3f5a7b9c1d3e5f7a9b1c4f9a5c0d
                    bundle: sha256:2b1a3c6d8e0f2a4b6c8d0e1f3a5b7c9d1e3f5a7b9c1d3e5f7a9b1c4f9a5c0d7e
                    rollback_of: 6
                    ruleset: 1
                    checks: { blocking: 0, advisory: 1 }
                    published_by: { id: 0193a4b2-6c1e-7a00-8000-000000000013, username: gyuan, display_name: Gu Yuan }
                    published_at: '2026-11-12T16:40:00Z'
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/resources/{code}/versions/{number}:
    get:
      operationId: getResourceVersion
      summary: One published version with its check results
      tags: [resources]
      security: [{ session: [] }, { device: [] }, { accessToken: [] }]
      x-token-scope: publish
      parameters:
        - { $ref: '#/components/parameters/ResourceCode' }
        - { $ref: '#/components/parameters/VersionNumber' }
      responses:
        '200':
          description: The version as it was published. It never changes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceVersion' }
              examples: { published: { $ref: '#/components/examples/ResourceVersion' } }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/resources/{code}/rollback:
    post:
      operationId: rollbackResource
      summary: Publish an earlier version's content again
      description: History is never rewritten; the result is a new version whose `rollback_of` names the old one.
      tags: [resources]
      parameters:
        - { $ref: '#/components/parameters/ResourceCode' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RollbackRequest' }
            example: { to_version: 8, note: v9 breaks on projects without a template }
      responses:
        '201':
          description: The new version.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceVersion' }
              examples: { published: { $ref: '#/components/examples/ResourceVersion' } }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/resources/{code}/impact:
    get:
      operationId: getResourceImpact
      summary: Who is affected if this resource is disabled or narrowed
      tags: [resources]
      parameters:
        - { $ref: '#/components/parameters/ResourceCode' }
        - name: scope
          in: query
          description: A narrower scope being considered. Without it, the impact of disabling.
          schema: { $ref: '#/components/schemas/Scope' }
      responses:
        '200':
          description: Who would lose it and what refers to it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Impact' }
              example:
                people: 58
                devices: 74
                referenced_by: [{ code: task-to-submit, kind: workflow, name: From task to submission }]
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/resources/{code}/disable:
    post:
      operationId: disableResource
      summary: Take a resource out of everyone's computers
      description: Removed at each computer's next sync. Versions and history stay; `enable` brings it back.
      tags: [resources]
      parameters:
        - { $ref: '#/components/parameters/ResourceCode' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
            example: { reason: Replaced by the new unit-testing skill }
      responses:
        '200':
          description: Disabled.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedResource' }
              examples: { published: { $ref: '#/components/examples/ManagedResource' } }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/resources/{code}/enable:
    post:
      operationId: enableResource
      summary: Bring a disabled resource back
      tags: [resources]
      parameters:
        - { $ref: '#/components/parameters/ResourceCode' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '200':
          description: Enabled again, at its last version.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedResource' }
              examples: { published: { $ref: '#/components/examples/ManagedResource' } }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/resources/{code}/waivers:
    post:
      operationId: waiveFinding
      summary: Mark a finding as a false positive
      description: |
        Platform administrators only, with a reason, audited. A waiver is
        tied to the rule, the file and the content of the line: when the
        content changes, it no longer applies. Only findings of rules that
        allow waivers (the suspected-secret rule) can be waived
        (`409 check.not_waivable`).
      tags: [resources]
      parameters:
        - { $ref: '#/components/parameters/ResourceCode' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WaiverRequest' }
            example: { finding: f-secrets-5d1c0e7a, reason: 'A documented example value, not a real password' }
      responses:
        '201':
          description: Waived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Waiver' }
              example:
                id: 0193a4b2-6c1e-7a00-8000-000000000601
                rule: secrets
                reason: A documented example value, not a real password
                by: { id: 0193a4b2-6c1e-7a00-8000-000000000001, username: admin, display_name: Local administrator }
                at: '2026-11-25T10:40:00Z'
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/check-rules:
    get:
      operationId: listCheckRules
      summary: The rule set every resource is checked against
      tags: [resources]
      security: [{ session: [] }, { device: [] }, { accessToken: [] }]
      x-token-scope: read
      responses:
        '200':
          description: The current rule set, with translated names.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuleSet' }
              example:
                version: 1
                rules:
                  - { id: structure, severity: must_fix, name: Structure, description: 'SKILL.md exists, has a name and a description, and the name equals the code.' }
                  - { id: secrets, severity: must_fix, name: Suspected secret, description: 'Common token formats, password=, private key headers, high-entropy strings.', waivable: true }
                  - { id: description, severity: should_fix, name: Description quality, description: The description is too short or does not say when to use it. }
        default: { $ref: '#/components/responses/Problem' }

  # --------------------------------------------------------------- sources
  /api/v1/sources:
    get:
      operationId: listSources
      summary: Resource repositories, in priority order
      tags: [sources]
      responses:
        '200':
          description: When two repositories have a resource with the same code, the earlier one wins.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceList' }
              example:
                items:
                  - id: 0193a4b2-6c1e-7a00-8000-000000000701
                    name: harness-resources
                    url: https://gitlab.example.com/platform/harness-resources.git
                    branch: main
                    dir: ''
                    order: 1
                    has_credential: true
                    resource_count: 41
                    last_pull: { at: '2026-11-25T04:00:00Z', result: ok, commit: 3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a, imported: 1, failed: 0, last_success_at: '2026-11-25T04:00:00Z' }
                    etag: '"s-0193a4b2-4"'
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createSource
      summary: Add a resource repository
      description: Platform administrators only. The first pull starts right away.
      tags: [sources]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSourceRequest' }
            example: { name: harness-resources, url: https://gitlab.example.com/platform/harness-resources.git, branch: main, dir: '', credential: '<placeholder: read-only repository token>' }
      responses:
        '201':
          description: Added.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
              examples: { pulled: { $ref: '#/components/examples/Source' } }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/sources/order:
    put:
      operationId: orderSources
      summary: Change the priority order of the repositories
      tags: [sources]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceOrderRequest' }
            example: { ids: [0193a4b2-6c1e-7a00-8000-000000000701] }
      responses:
        '200':
          description: The repositories in their new order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceList' }
              example:
                items:
                  - id: 0193a4b2-6c1e-7a00-8000-000000000701
                    name: harness-resources
                    url: https://gitlab.example.com/platform/harness-resources.git
                    branch: main
                    dir: ''
                    order: 1
                    has_credential: true
                    resource_count: 41
                    last_pull: { at: '2026-11-25T04:00:00Z', result: ok, commit: 3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a, imported: 1, failed: 0, last_success_at: '2026-11-25T04:00:00Z' }
                    etag: '"s-0193a4b2-4"'
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/sources/{source_id}:
    get:
      operationId: getSource
      summary: One resource repository
      tags: [sources]
      parameters:
        - { $ref: '#/components/parameters/SourceId' }
      responses:
        '200':
          description: The repository and its last pull.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
              examples: { pulled: { $ref: '#/components/examples/Source' } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateSource
      summary: Change a resource repository
      description: The credential is write-only; `clear_credential` removes it. Only from the browser.
      tags: [sources]
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/SourceId' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSourceRequest' }
            example: { branch: release }
      responses:
        '200':
          description: Changed.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
              examples: { pulled: { $ref: '#/components/examples/Source' } }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteSource
      summary: Stop importing from a repository
      description: Resources already imported keep their versions and stay as they are; they just get no new drafts.
      tags: [sources]
      parameters:
        - { $ref: '#/components/parameters/SourceId' }
      responses:
        '204': { description: Removed. }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/sources/{source_id}/pull:
    post:
      operationId: pullSource
      summary: Pull a repository now
      description: Queues the same job that runs every ten minutes. A failed pull keeps the last good state; it never removes resources.
      tags: [sources]
      parameters:
        - { $ref: '#/components/parameters/SourceId' }
      responses:
        '202':
          description: Queued. Poll the source for the result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
              examples: { pulled: { $ref: '#/components/examples/Source' } }
        default: { $ref: '#/components/responses/Problem' }

  # -------------------------------------------------------------- products
  /api/v1/products:
    get:
      operationId: listProducts
      summary: All products
      description: Every signed-in person can list them, including someone not yet activated choosing what to join.
      tags: [products]
      responses:
        '200':
          description: By name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductList' }
              example:
                items:
                  - code: shop
                    name: Shop
                    line: Commerce
                    owners: [{ id: 0193a4b2-6c1e-7a00-8000-000000000013, username: gyuan, display_name: Gu Yuan }]
                    member_count: 64
                    resource_count: 7
                    my_role: member
                  - code: pay
                    name: Payments
                    line: Commerce
                    owners: [{ id: 0193a4b2-6c1e-7a00-8000-000000000014, username: blu, display_name: Bai Lu }]
                    member_count: 38
                    resource_count: 3
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createProduct
      summary: Create a product
      description: |
        Platform administrators only. The code is permanent and is the first
        word of product commands, so it cannot be a command name or `org`/`me`
        (`409 product.code_reserved`) or already taken (`409 product.code_taken`).
      tags: [products]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProductRequest' }
            example: { code: shop, name: Shop, line: Commerce, owners: [0193a4b2-6c1e-7a00-8000-000000000013] }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
              examples: { shop: { $ref: '#/components/examples/Product' } }
        '409':
          description: The code is taken or reserved.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: about:blank, title: Conflict, status: 409, code: product.code_reserved, detail: '"sync" is a command name and cannot be a product code.', params: { code: sync }, request_id: 01JDV6ZQ8M3K }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/products/{product}:
    get:
      operationId: getProduct
      summary: One product
      tags: [products]
      parameters:
        - { $ref: '#/components/parameters/ProductCodePath' }
      responses:
        '200':
          description: The product.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
              examples: { shop: { $ref: '#/components/examples/Product' } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateProduct
      summary: Rename a product or change its product line
      description: The code cannot change.
      tags: [products]
      parameters:
        - { $ref: '#/components/parameters/ProductCodePath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProductRequest' }
            example: { name: Shop, line: Commerce }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
              examples: { shop: { $ref: '#/components/examples/Product' } }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/products/{product}/members:
    get:
      operationId: listProductMembers
      summary: A product's owners and members
      tags: [products]
      parameters:
        - { $ref: '#/components/parameters/ProductCodePath' }
      responses:
        '200':
          description: Owners first, then by name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberList' }
              example:
                items:
                  - { user: { id: 0193a4b2-6c1e-7a00-8000-000000000013, username: gyuan, display_name: Gu Yuan }, role: owner, job: Developer, focus_stages: [design, develop], added_at: '2026-09-01T08:00:00Z' }
                  - { user: { id: 0193a4b2-6c1e-7a00-8000-000000000011, username: jdoe, display_name: Jamie Doe }, role: member, job: Developer, focus_stages: [develop], added_at: '2026-10-12T08:00:00Z' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/products/{product}/members/{user_id}:
    put:
      operationId: putProductMember
      summary: Add someone to a product, or change their role in it
      description: The person gets the product's resources at their next sync. A product always keeps at least one owner (`409 product.last_owner`).
      tags: [products]
      parameters:
        - { $ref: '#/components/parameters/ProductCodePath' }
        - { $ref: '#/components/parameters/UserId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutMemberRequest' }
            example: { role: member }
      responses:
        '200':
          description: The role changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
              examples: { member: { $ref: '#/components/examples/Member' } }
        '201':
          description: Added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
              examples: { member: { $ref: '#/components/examples/Member' } }
        '409':
          description: This would leave the product without an owner (`product.last_owner`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: about:blank, title: Conflict, status: 409, code: product.last_owner, detail: A product needs at least one owner., params: { product: shop }, request_id: 01JDV6ZQ8M3K }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: removeProductMember
      summary: Take someone out of a product
      description: Effective with their next request; the product's resources leave their computers at the next sync.
      tags: [products]
      parameters:
        - { $ref: '#/components/parameters/ProductCodePath' }
        - { $ref: '#/components/parameters/UserId' }
      responses:
        '204': { description: Removed. }
        '409':
          description: This would leave the product without an owner (`product.last_owner`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: about:blank, title: Conflict, status: 409, code: product.last_owner, detail: A product needs at least one owner., params: { product: shop }, request_id: 01JDV6ZQ8M3K }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/join-requests:
    get:
      operationId: listJoinRequests
      summary: Requests to join products that I can decide on
      description: Platform administrators see all of them; product owners those for their products.
      tags: [products]
      parameters:
        - { name: product, in: query, schema: { $ref: '#/components/schemas/ProductCode' } }
        - { name: status, in: query, description: Defaults to pending., schema: { $ref: '#/components/schemas/JoinRequestStatus' } }
      responses:
        '200':
          description: Oldest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinRequestList' }
              example:
                items:
                  - id: 0193a4b2-6c1e-7a00-8000-000000000501
                    user: { id: 0193a4b2-6c1e-7a00-8000-000000000012, username: wyan, display_name: Wen Yan }
                    job: Developer
                    focus_stages: [design, develop]
                    identity: GitLab
                    product: { code: shop, name: Shop }
                    note: Joining the shop backend team
                    status: pending
                    created_at: '2026-11-25T10:26:00Z'
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/join-requests/{request_id}/approve:
    post:
      operationId: approveJoinRequest
      summary: Let someone into a product
      description: The first approved request activates a pending account.
      tags: [products]
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
      responses:
        '200':
          description: Approved; they are a member now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinRequest' }
              examples: { decided: { $ref: '#/components/examples/JoinRequestApproved' } }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/join-requests/{request_id}/reject:
    post:
      operationId: rejectJoinRequest
      summary: Turn a request down, saying why
      tags: [products]
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
            example: { reason: Please check with your team lead which product to join first }
      responses:
        '200':
          description: Rejected; the person is notified with the reason.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinRequest' }
              examples: { decided: { $ref: '#/components/examples/JoinRequestApproved' } }
        default: { $ref: '#/components/responses/Problem' }

  # ----------------------------------------------------------------- users
  /api/v1/users:
    get:
      operationId: listUsers
      summary: Accounts
      description: |
        Platform administrators see everything. Product owners can search
        too (to add members) and get the same list.
      tags: [users]
      parameters:
        - { name: q, in: query, description: 'Matches username, display name and e-mail address.', schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/UserStatus' } }
      responses:
        '200':
          description: By display name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserList' }
              example:
                items:
                  - id: 0193a4b2-6c1e-7a00-8000-000000000011
                    username: jdoe
                    display_name: Jamie Doe
                    email: jdoe@example.com
                    email_verified: true
                    status: active
                    platform_admin: false
                    job: Developer
                    focus_stages: [design, develop]
                    memberships: [{ product: { code: shop, name: Shop }, role: member }]
                    identities: [0193a4b2-6c1e-7a00-8000-000000000102]
                    created_at: '2026-10-12T08:00:00Z'
                    last_login_at: '2026-11-25T10:12:00Z'
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/users/{user_id}:
    get:
      operationId: getUser
      summary: One account
      tags: [users]
      parameters:
        - { $ref: '#/components/parameters/UserId' }
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              examples: { active: { $ref: '#/components/examples/User' } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateUser
      summary: Disable or restore an account, grant or take platform administration
      description: |
        Disabling takes effect with the account's next request: sessions,
        device tokens and access tokens stop working, and resources leave
        their computers at the next sync. The platform always keeps at least
        one administrator (`409 user.last_admin`).
      tags: [users]
      parameters:
        - { $ref: '#/components/parameters/UserId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
            example: { status: disabled }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              examples: { active: { $ref: '#/components/examples/User' } }
        '409':
          description: This would leave no platform administrator (`user.last_admin`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: about:blank, title: Conflict, status: 409, code: user.last_admin, detail: The platform needs at least one administrator., request_id: 01JDV6ZQ8M3K }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/invites:
    get:
      operationId: listInvites
      summary: Invitations not yet accepted
      tags: [users]
      responses:
        '200':
          description: Newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteList' }
              example:
                items:
                  - id: 0193a4b2-6c1e-7a00-8000-000000000901
                    email: new.colleague@example.com
                    products: [{ code: shop, name: Shop }]
                    created_by: { id: 0193a4b2-6c1e-7a00-8000-000000000001, username: admin, display_name: Local administrator }
                    created_at: '2026-11-25T09:00:00Z'
                    expires_at: '2026-12-02T09:00:00Z'
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createInvites
      summary: Invite people to local accounts
      description: Each address gets a one-time link valid for seven days. People who sign in with SSO or GitLab need no invitation.
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvitesRequest' }
            example: { emails: [new.colleague@example.com], products: [shop] }
      responses:
        '201':
          description: Sent (or queued when mail is not configured; the link is then shown to the administrator once).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteList' }
              example:
                items:
                  - id: 0193a4b2-6c1e-7a00-8000-000000000901
                    email: new.colleague@example.com
                    products: [{ code: shop, name: Shop }]
                    created_by: { id: 0193a4b2-6c1e-7a00-8000-000000000001, username: admin, display_name: Local administrator }
                    created_at: '2026-11-25T09:00:00Z'
                    expires_at: '2026-12-02T09:00:00Z'
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/invites/{invite_id}:
    delete:
      operationId: revokeInvite
      summary: Withdraw an invitation
      tags: [users]
      parameters:
        - { $ref: '#/components/parameters/InviteId' }
      responses:
        '204': { description: The link no longer works. }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/identity-providers:
    get:
      operationId: listIdentityProviders
      summary: Sign-in methods
      description: Includes the built-in local accounts (id `local`). Secrets are never returned, only whether one is set.
      tags: [users]
      responses:
        '200':
          description: In the order the login page shows them.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityProviderList' }
              example:
                items:
                  - { id: local, kind: local, name: Local account, enabled: true, config: {}, has_client_secret: false, etag: '"p-local-3"' }
                  - id: 0193a4b2-6c1e-7a00-8000-000000000101
                    kind: oidc
                    name: Company SSO
                    enabled: true
                    config: { issuer: https://sso.example.com/realms/dev, client_id: rigdepot }
                    has_client_secret: true
                    etag: '"p-0193a4b2-2"'
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createIdentityProvider
      summary: Add a sign-in method
      description: The client secret can only be entered in the browser; it is encrypted at once and never returned.
      tags: [users]
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIdentityProviderRequest' }
            example:
              kind: oidc
              name: Company SSO
              enabled: true
              config: { issuer: https://sso.example.com/realms/dev, client_id: rigdepot }
              client_secret: '<placeholder: OIDC client secret>'
      responses:
        '201':
          description: Added.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityProvider' }
              examples: { oidc: { $ref: '#/components/examples/IdentityProvider' } }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/identity-providers/kinds:
    get:
      operationId: listIdentityProviderKinds
      summary: The kinds of sign-in methods this server can use, and what each needs
      description: '`config_schema` is a JSON Schema the settings form is rendered from.'
      tags: [users]
      responses:
        '200':
          description: The kinds compiled into this server.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityProviderKindList' }
              example:
                items:
                  - kind: oidc
                    name: OpenID Connect
                    config_schema:
                      type: object
                      required: [issuer, client_id]
                      properties:
                        issuer: { type: string, format: uri }
                        client_id: { type: string }
                  - kind: gitlab
                    name: GitLab
                    config_schema:
                      type: object
                      required: [url, client_id]
                      properties:
                        url: { type: string, format: uri }
                        client_id: { type: string }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/identity-providers/{provider_id}:
    get:
      operationId: getIdentityProvider
      summary: One sign-in method
      tags: [users]
      parameters:
        - { $ref: '#/components/parameters/ProviderId' }
      responses:
        '200':
          description: The method.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityProvider' }
              examples: { oidc: { $ref: '#/components/examples/IdentityProvider' } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateIdentityProvider
      summary: Change a sign-in method
      description: |
        A new `client_secret` replaces the old one. Turning off the last
        enabled method is refused (`409 identity.last_method`). Only from the
        browser.
      tags: [users]
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProviderId' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateIdentityProviderRequest' }
            example: { enabled: false }
      responses:
        '200':
          description: Changed.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityProvider' }
              examples: { oidc: { $ref: '#/components/examples/IdentityProvider' } }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteIdentityProvider
      summary: Remove a sign-in method
      description: Accounts linked to it keep existing and can still use other methods. The local method cannot be removed, only turned off.
      tags: [users]
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/ProviderId' }
      responses:
        '204': { description: Removed. }
        default: { $ref: '#/components/responses/Problem' }

  # -------------------------------------------------------------- feedback
  /api/v1/feedback:
    get:
      operationId: listFeedback
      summary: Feedback I can see
      description: |
        Everyone sees what they submitted. Product owners also see feedback
        about their products' resources; platform administrators see all.
      tags: [feedback]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/FeedbackStatus' } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/FeedbackType' } }
        - { name: resource, in: query, schema: { $ref: '#/components/schemas/ResourceCode' } }
        - { name: mine, in: query, description: Only what I submitted., schema: { type: boolean } }
        - { name: assigned_to_me, in: query, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Most recently updated first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedbackPage' }
              example:
                items:
                  - number: 41
                    title: unit-testing generated var in a Java 8 project
                    type: bug
                    origin: ai
                    status: accepted
                    severity: medium
                    submitter: { id: 0193a4b2-6c1e-7a00-8000-000000000011, username: jdoe, display_name: Jamie Doe }
                    assignee: { id: 0193a4b2-6c1e-7a00-8000-000000000013, username: gyuan, display_name: Gu Yuan }
                    resource: { code: unit-testing, kind: skill, name: Unit testing }
                    resource_version: 4
                    created_at: '2026-11-24T17:40:00Z'
                    updated_at: '2026-11-25T09:00:00Z'
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createFeedback
      summary: Submit feedback
      description: |
        `origin` is decided by the server from how the request came in (web,
        command line) and `ai_drafted`. The context keeps only the fields of
        `FeedbackContext`; anything else is dropped, and there is never room
        for conversation content.
      tags: [feedback]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFeedbackRequest' }
            example:
              type: bug
              title: unit-testing generated var in a Java 8 project
              body: In an old Java 8 project the generated tests used var and did not compile.
              resource: unit-testing
              resource_version: 4
              ai_drafted: true
              context: { tool: claude-code, tool_version: 2.1.330, cli_version: 0.5.0, os: darwin, frictions: [{ type: repeated_correction, count: 2 }] }
      responses:
        '201':
          description: Submitted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Feedback' }
              examples: { bug: { $ref: '#/components/examples/Feedback' } }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/feedback/summary:
    get:
      operationId: getFeedbackSummary
      summary: How much feedback is in which state
      description: Over the same set the caller can list; for the filter tabs and the home page.
      tags: [feedback]
      parameters:
        - { name: mine, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedbackSummary' }
              example: { open: 3, by_status: { new: 1, accepted: 1, in_progress: 1, resolved: 2, wont_fix: 0 } }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/feedback/{number}:
    get:
      operationId: getFeedback
      summary: One piece of feedback with its timeline
      tags: [feedback]
      parameters:
        - { $ref: '#/components/parameters/FeedbackNumber' }
      responses:
        '200':
          description: The feedback.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Feedback' }
              examples: { bug: { $ref: '#/components/examples/Feedback' } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateFeedback
      summary: Change status, assignee or severity
      description: |
        For whoever handles it: the product's owners for feedback about a
        product resource, platform administrators otherwise. `wont_fix`
        needs `status_reason` (`400 feedback.reason_required`). Status
        changes are added to the timeline and notify the submitter.
      tags: [feedback]
      parameters:
        - { $ref: '#/components/parameters/FeedbackNumber' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateFeedbackRequest' }
            example: { status: in_progress, assignee: 0193a4b2-6c1e-7a00-8000-000000000013 }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Feedback' }
              examples: { bug: { $ref: '#/components/examples/Feedback' } }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/feedback/{number}/comments:
    post:
      operationId: commentOnFeedback
      summary: Reply
      tags: [feedback]
      parameters:
        - { $ref: '#/components/parameters/FeedbackNumber' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentRequest' }
            example: { body: Fixed in v5; sync again and it detects the Java version first. }
      responses:
        '201':
          description: Added to the timeline.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedbackEvent' }
              example:
                id: 0193a4b2-6c1e-7a00-8000-000000000802
                kind: comment
                by: { id: 0193a4b2-6c1e-7a00-8000-000000000013, username: gyuan, display_name: Gu Yuan }
                body: Fixed in v5; sync again and it detects the Java version first.
                at: '2026-11-25T11:00:00Z'
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/feedback/{number}/rate:
    post:
      operationId: rateFeedback
      summary: Rate how it was resolved
      description: Only the submitter, only once it is resolved (`409 feedback.not_resolved`). A score of 1 or 2 reopens it and notifies the handler.
      tags: [feedback]
      parameters:
        - { $ref: '#/components/parameters/FeedbackNumber' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RateRequest' }
            example: { score: 5, note: Answered the same day }
      responses:
        '200':
          description: Rated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Feedback' }
              examples: { bug: { $ref: '#/components/examples/Feedback' } }
        default: { $ref: '#/components/responses/Problem' }

  # ----------------------------------------------------------------- audit
  /api/v1/audit:
    get:
      operationId: listAudit
      summary: Search the audit log
      description: |
        Platform administrators see everything. Everyone else sees entries
        they made or that were about them, and maintainers and owners the
        entries about resources they manage
        (`object_kind=resource&object_id=<code>`).
      tags: [audit]
      parameters:
        - { $ref: '#/components/parameters/AuditCategory' }
        - { $ref: '#/components/parameters/AuditActor' }
        - { $ref: '#/components/parameters/AuditAction' }
        - { $ref: '#/components/parameters/AuditObjectKind' }
        - { $ref: '#/components/parameters/AuditObjectId' }
        - { $ref: '#/components/parameters/AuditResult' }
        - { $ref: '#/components/parameters/Since' }
        - { $ref: '#/components/parameters/Until' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
              example:
                items:
                  - seq: 1842
                    at: '2026-11-25T10:02:00Z'
                    category: platform
                    actor: { id: 0193a4b2-6c1e-7a00-8000-000000000013, username: gyuan, display_name: Gu Yuan }
                    origin: cli
                    via_tool: claude-code
                    device: { id: 0193a4b2-6c1e-7a00-8000-000000000202, name: gyuan-laptop }
                    action: resource.publish
                    action_label: Publish resource
                    object: { kind: resource, id: task-development, label: Task development }
                    change: { version: { from: 11, to: 12 }, files_changed: 1 }
                    result: ok
                  - seq: 1841
                    at: '2026-11-25T09:12:00Z'
                    category: platform
                    actor: { id: 0193a4b2-6c1e-7a00-8000-000000000011, username: jdoe, display_name: Jamie Doe }
                    origin: cli
                    via_tool: claude-code
                    device: { id: 0193a4b2-6c1e-7a00-8000-000000000201, name: dev-laptop }
                    action: resource.publish
                    action_label: Publish resource
                    object: { kind: resource, id: task-development, label: Task development }
                    change: {}
                    result: denied
                    reason: not a maintainer of this resource
                next_cursor: eyJzIjoxODQwfQ
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/audit/export:
    get:
      operationId: exportAudit
      summary: Export the audit log as CSV
      description: Same filters and permissions as the search; everything that matches, oldest first. The export itself is audited.
      tags: [audit]
      parameters:
        - { $ref: '#/components/parameters/AuditCategory' }
        - { $ref: '#/components/parameters/AuditActor' }
        - { $ref: '#/components/parameters/AuditAction' }
        - { $ref: '#/components/parameters/AuditObjectKind' }
        - { $ref: '#/components/parameters/AuditObjectId' }
        - { $ref: '#/components/parameters/AuditResult' }
        - { $ref: '#/components/parameters/Since' }
        - { $ref: '#/components/parameters/Until' }
      responses:
        '200':
          description: 'RFC 4180 CSV, UTF-8, with a header row.'
          content:
            text/csv:
              schema: { type: string, format: binary }
              example: "seq,at,category,actor,origin,via_tool,device,action,object_kind,object_id,object_label,change,result,reason\n1842,2026-11-25T10:02:00Z,platform,gyuan,cli,claude-code,gyuan-laptop,resource.publish,resource,task-development,Task development,\"{\"\"version\"\":{\"\"from\"\":11,\"\"to\"\":12}}\",ok,\n"
        default: { $ref: '#/components/responses/Problem' }

  # -------------------------------------------------------------- settings
  /api/v1/settings:
    get:
      operationId: getSettings
      summary: Platform settings
      description: Platform administrators only. Secrets are never returned, only whether they are set.
      tags: [settings]
      responses:
        '200':
          description: The settings.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformSettings' }
              examples: { configured: { $ref: '#/components/examples/PlatformSettings' } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateSettings
      summary: Change platform settings
      description: Every change is audited (secrets as "replaced"). Only from the browser, because it can carry the mail password.
      tags: [settings]
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSettingsRequest' }
            example:
              organization: { name: Example Corp }
              mail: { enabled: true, host: smtp.example.com, port: 465, security: tls, username: rigdepot@example.com, password: '<placeholder: mail password>', from: rigdepot@example.com }
      responses:
        '200':
          description: Changed.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformSettings' }
              examples: { configured: { $ref: '#/components/examples/PlatformSettings' } }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/settings/mail/test:
    post:
      operationId: sendTestMail
      summary: Send a test message with the saved mail settings
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestMailRequest' }
            example: { to: admin@example.com }
      responses:
        '204': { description: The mail server accepted it. }
        '502':
          description: The mail server refused it or could not be reached (`mail.failed`); the error is in `detail`, with the password masked.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: about:blank, title: Bad Gateway, status: 502, code: mail.failed, detail: 'smtp.example.com:465: authentication failed', request_id: 01JDV6ZQ8M3K }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/modules:
    get:
      operationId: listModules
      summary: Optional modules compiled into this server
      description: A module left out of the build is not listed at all. Enabled ones are also in `/meta`.
      tags: [settings]
      responses:
        '200':
          description: Each module, whether it is on, and what turning it on means.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModuleList' }
              example:
                items:
                  - id: insights
                    name: Usage insights
                    description: Counts, outcomes and durations of resource use. Never prompts, code, arguments or results.
                    enabled: false
                    notice: Computers start reporting usage metadata at their next sync. Each person can still turn it off on their own computer.
                    locked: false
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/modules/{module_id}:
    patch:
      operationId: updateModule
      summary: Turn a module on or off
      description: |
        Turning off keeps the module's tables and data. A module the
        deployment disabled (RGD_MODULES_DISABLED) stays off
        (`409 module.locked`).
      tags: [settings]
      parameters:
        - { $ref: '#/components/parameters/ModuleId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateModuleRequest' }
            example: { enabled: true }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Module' }
              example:
                id: insights
                name: Usage insights
                description: Counts, outcomes and durations of resource use. Never prompts, code, arguments or results.
                enabled: true
                notice: Computers start reporting usage metadata at their next sync. Each person can still turn it off on their own computer.
                locked: false
        default: { $ref: '#/components/responses/Problem' }

  # -------------------------------------------------------------- adapters
  /api/v1/adapters:
    get:
      operationId: listAdapters
      summary: The built-in tool adapters
      description: |
        Where each tool gets each kind of resource, how it falls back, which
        tool version that was verified against, whether the organisation uses
        it, and how many people have it. Everything except `enabled` and
        `people` comes from the adapter's built-in profile.
      tags: [adapters]
      responses:
        '200':
          description: The adapters, in registration order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdapterList' }
              example:
                items:
                  - id: claude-code
                    name: Claude Code
                    verified: { version: 2.1.330, at: '2026-11-24' }
                    enabled: true
                    people: 164
                    targets:
                      skill: { location: '~/.claude/skills/' }
                      mcp: { location: '~/.claude.json', detail: mcpServers }
                      command: { location: '~/.claude/commands/' }
                      agent: { location: '~/.claude/agents/' }
                      hook: { location: '~/.claude/settings.json', detail: hooks, opt_in: true }
                  - id: opencode
                    name: OpenCode
                    verified: { version: 2.2.7, at: '2026-11-24' }
                    enabled: true
                    people: 23
                    targets:
                      skill: { location: '~/.config/opencode/skills/' }
                      mcp: { location: '~/.config/opencode/opencode.json', detail: mcp.servers }
                      command: { location: '~/.config/opencode/commands/' }
                      agent: { location: '~/.config/opencode/agents/' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/adapters/{adapter_id}:
    patch:
      operationId: updateAdapter
      summary: Turn a tool on or off for the whole organisation
      description: |
        Turned off, nothing is written into that tool any more and what was
        written is cleaned up at each computer's next sync. A computer can
        turn a tool off for itself; it cannot turn on one the organisation
        turned off.
      tags: [adapters]
      parameters:
        - { $ref: '#/components/parameters/AdapterId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAdapterRequest' }
            example: { enabled: false }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Adapter' }
              examples: { claude: { $ref: '#/components/examples/Adapter' } }
        default: { $ref: '#/components/responses/Problem' }

  # ------------------------------------------------------------------- cli
  /api/v1/cli:
    get:
      operationId: getCLIPolicy
      summary: Command-line versions the server accepts, and who runs which
      tags: [cli]
      responses:
        '200':
          description: The policy and the version distribution from sync reports.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CLIPolicy' }
              examples: { current: { $ref: '#/components/examples/CLIPolicy' } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateCLIPolicy
      summary: Raise or lower the minimum command-line version
      description: |
        Platform administrators only. Older command lines refuse to sync
        and tell the person how to upgrade; status and uninstall keep
        working. Cannot go below `min_version_floor`, what this server
        itself supports (`409 cli.below_floor`).
      tags: [cli]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCLIPolicyRequest' }
            example: { min_version: 0.5.0 }
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CLIPolicy' }
              examples: { current: { $ref: '#/components/examples/CLIPolicy' } }
        '409':
          description: Below what this server supports (`cli.below_floor`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: about:blank, title: Conflict, status: 409, code: cli.below_floor, detail: This server needs at least 0.4.0., params: { floor: 0.4.0 }, request_id: 01JDV6ZQ8M3K }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/cli/downloads:
    get:
      operationId: listCLIDownloads
      summary: The command-line binaries this server hands out
      description: For the connection guide. Binaries ship with the server (RGD_CLI_DIST_DIR); when they are missing, `url` points at RGD_CLI_DOWNLOAD_BASE instead.
      tags: [cli]
      security: [{}]
      responses:
        '200':
          description: One per platform, plus the install commands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CLIDownloadList' }
              example:
                version: 0.5.0
                install_sh: https://hub.example.com/install.sh
                install_ps1: https://hub.example.com/install.ps1
                items:
                  - { os: darwin, arch: arm64, file: rgd-darwin-arm64, url: https://hub.example.com/downloads/rgd-darwin-arm64, sha256: 5b7c9d1e3f5a7b9c1d3e5f7a9b1c4f9a5c0d7e2b1a3c6d8e0f2a4b6c8d0e1f3a, size: 9437184 }
                  - { os: windows, arch: amd64, file: rgd-windows-amd64.exe, url: https://hub.example.com/downloads/rgd-windows-amd64.exe, sha256: 3c6d8e0f2a4b6c8d0e1f3a5b7c9d1e3f5a7b9c1d3e5f7a9b1c4f9a5c0d7e2b1a, size: 9830400 }
        default: { $ref: '#/components/responses/Problem' }

  /install.sh:
    get:
      operationId: getInstallScript
      summary: The installer for macOS and Linux
      description: |
        Download, verify against the checksum the server filled in, put in
        place, explain how to add it to PATH. It does not sign in, sync or
        install anything that runs in the background.
      tags: [cli]
      security: [{}]
      responses:
        '200':
          description: A POSIX shell script with this server's address, version and checksums filled in.
          content:
            text/plain:
              schema: { type: string }
              example: "#!/bin/sh\n# Installs the command line from https://hub.example.com\nset -eu\n"
        default: { $ref: '#/components/responses/Problem' }

  /install.ps1:
    get:
      operationId: getInstallPowerShell
      summary: The installer for Windows
      tags: [cli]
      security: [{}]
      responses:
        '200':
          description: A PowerShell script with this server's address, version and checksums filled in.
          content:
            text/plain:
              schema: { type: string }
              example: "# Installs the command line from https://hub.example.com\n$ErrorActionPreference = 'Stop'\n"
        default: { $ref: '#/components/responses/Problem' }

  /downloads/{file}:
    get:
      operationId: downloadCLI
      summary: A command-line binary
      tags: [cli]
      security: [{}]
      parameters:
        - name: file
          in: path
          required: true
          description: '`<cli>-<os>-<arch>`, with `.exe` on Windows, as listed by `/api/v1/cli/downloads`.'
          schema: { type: string, pattern: '^[a-z][a-z0-9-]*-(darwin|linux|windows)-(amd64|arm64)(\.exe)?$', example: rgd-linux-amd64 }
      responses:
        '200':
          description: The binary.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
              example: '<executable>'
        '302':
          description: Not shipped with this server; fetch it from the configured download base instead.
          headers:
            Location: { $ref: '#/components/headers/Location' }
        default: { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: rgd_session
      description: |
        The web console's session: 256 random bits, `HttpOnly`, `Secure`
        (when the base address is https), `SameSite=Lax`, path `/`. Idle
        sessions end after 7 days, all sessions after 30. Unsafe methods are
        refused for cross-site requests (`Sec-Fetch-Site`, `Origin`).
    device:
      type: http
      scheme: bearer
      description: A device token (`rgdd_…`) from `rgd login`. Bound to one computer; signed out after 90 days without activity.
    accessToken:
      type: http
      scheme: bearer
      description: An access token (`rgd_…`) for programs. Operations accepting it name the needed scope in `x-token-scope`.

  headers:
    ETag:
      description: The current version of the object, to send back in `If-Match` (or `If-None-Match`).
      schema: { type: string, example: '"r-unit-testing-17"' }
    Location:
      description: Where to go.
      schema: { type: string, example: https://sso.example.com/realms/dev/protocol/openid-connect/auth }
    SetSession:
      description: Sets the session cookie.
      schema: { type: string, example: 'rgd_session=<placeholder: session>; Path=/; HttpOnly; Secure; SameSite=Lax' }
    ClearSession:
      description: Removes the session cookie.
      schema: { type: string, example: 'rgd_session=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Lax' }

  parameters:
    Limit:
      name: limit
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: '`next_cursor` from the previous page.'
      schema: { type: string, maxLength: 512 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The ETag the change is based on. Missing is `428`; outdated is `412`.
      schema: { type: string }
    IfMatchOptional:
      name: If-Match
      in: header
      description: The ETag of the current draft. Required when the resource has a draft (`428` otherwise).
      schema: { type: string }
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: The ETag of the copy the client already has.
      schema: { type: string }
    SetupToken:
      name: X-Setup-Token
      in: header
      required: true
      description: The one-time setup token from the server log.
      schema: { type: string, minLength: 1, maxLength: 200 }
    ResourceCode:
      name: code
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ResourceCode' }
    ProductCodePath:
      name: product
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ProductCode' }
    VersionNumber:
      name: number
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    FeedbackNumber:
      name: number
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    FilePath:
      name: path
      in: query
      required: true
      description: The file's path inside the resource, with forward slashes.
      schema: { type: string, minLength: 1, maxLength: 1024, example: references/checklist.md }
    KindFilter:
      name: kind
      in: query
      schema: { $ref: '#/components/schemas/Kind' }
    UserId: { name: user_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    DeviceId: { name: device_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    TokenId: { name: token_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    SourceId: { name: source_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    RequestId: { name: request_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    InviteId: { name: invite_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    ProviderId:
      name: provider_id
      in: path
      required: true
      description: '`local`, or the id of a configured identity provider.'
      schema: { type: string, minLength: 1, maxLength: 64 }
    ModuleId:
      name: module_id
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z][a-z0-9-]{1,31}$' }
    AdapterId:
      name: adapter_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ToolId' }
    SecretName:
      name: secret_name
      in: path
      required: true
      schema: { $ref: '#/components/schemas/SecretName' }
    InviteToken:
      name: invite_token
      in: path
      required: true
      description: The token from the invitation link.
      schema: { type: string, minLength: 16, maxLength: 128 }
    UserCode:
      name: user_code
      in: path
      required: true
      description: The code the terminal shows, as typed or with the hyphen.
      schema: { type: string, pattern: '^[A-Z0-9]{4}-?[A-Z0-9]{4}$', example: KQ7M-2XHP }
    AuditCategory: { name: category, in: query, schema: { $ref: '#/components/schemas/AuditCategory' } }
    AuditActor: { name: actor, in: query, description: 'A user id, or `me`.', schema: { type: string } }
    AuditAction: { name: action, in: query, description: 'An action such as `resource.publish`, or a prefix ending in a dot: `resource.`.', schema: { type: string, maxLength: 64 } }
    AuditObjectKind: { name: object_kind, in: query, schema: { type: string, maxLength: 32 } }
    AuditObjectId: { name: object_id, in: query, schema: { type: string, maxLength: 128 } }
    AuditResult: { name: result, in: query, schema: { $ref: '#/components/schemas/AuditResult' } }
    Since: { name: since, in: query, description: From this time on (inclusive)., schema: { type: string, format: date-time } }
    Until: { name: until, in: query, description: Before this time (exclusive)., schema: { type: string, format: date-time } }

  responses:
    Problem:
      description: An error, as a problem document. See "Common errors".
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Bad Request
            status: 400
            code: request.invalid
            detail: The request has invalid fields.
            errors: [{ field: name, code: required }]
            request_id: 01JDV6ZQ8M3K
    PreconditionFailed:
      description: '`If-Match` does not match the current ETag (`precondition.failed`): someone changed it since you looked. Fetch it again.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: about:blank, title: Precondition Failed, status: 412, code: precondition.failed, detail: This changed after you opened it. Reload to see the latest., request_id: 01JDV6ZQ8M3K }
    PreconditionRequired:
      description: '`If-Match` is missing (`precondition.required`).'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: about:blank, title: Precondition Required, status: 428, code: precondition.required, detail: Send the ETag you are basing this change on in If-Match., request_id: 01JDV6ZQ8M3K }

  schemas:
    # ------------------------------------------------------ building blocks
    Id:
      type: string
      description: An object's id, a UUIDv7.
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      example: 0193a4b2-6c1e-7a00-8000-000000000011
    ResourceCode:
      type: string
      description: A resource's code. Lower-case letters, digits and single hyphens; permanent once published.
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      minLength: 2
      maxLength: 48
      example: unit-testing
    ProductCode:
      type: string
      description: A product's code. Same characters as a resource code; permanent; never `org` or `me` or a command name.
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      minLength: 2
      maxLength: 32
      example: shop
    Scope:
      type: string
      description: Who a resource is for - `org` (everyone), `me` (only its author), or a product code.
      pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      maxLength: 32
      example: org
    Kind:
      type: string
      description: |
        A resource kind. Kinds are an extension point, so this is not a closed
        list; the built-in ones are `skill`, `mcp`, `workflow`, `agent` and
        `knowledge`.
      pattern: '^[a-z][a-z0-9-]{1,31}$'
      example: skill
    ToolId:
      type: string
      description: An AI tool adapter's id, such as `claude-code`, `codex`, `opencode`. Adapters are an extension point.
      pattern: '^[a-z][a-z0-9-]{1,31}$'
      example: claude-code
    StageId:
      type: string
      pattern: '^[a-z][a-z0-9-]{1,31}$'
      example: develop
    SecretName:
      type: string
      description: The name of a personal secret, as resources refer to it in `${secret:NAME}`.
      pattern: '^[A-Z][A-Z0-9_]{1,63}$'
      example: JIRA_API_TOKEN
    Digest:
      type: string
      description: '`sha256:` and 64 lower-case hexadecimal digits.'
      pattern: '^sha256:[0-9a-f]{64}$'
      example: sha256:4f9a5c0d7e2b1a3c6d8e0f2a4b6c8d0e1f3a5b7c9d1e3f5a7b9c1d3e5f7a9b1c
    SemVer:
      type: string
      description: A version number, `MAJOR.MINOR.PATCH` with an optional pre-release suffix.
      pattern: '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$'
      example: 0.5.0
    Etag:
      type: string
      description: The object's current ETag; send it in `If-Match` to change the object.
      example: '"r-unit-testing-17"'
    Policy:
      type: string
      enum: [required, recommended, optional]
      description: '`required` - everyone in scope gets it and cannot turn it off; `recommended` - on by default; `optional` - only for those who turn it on.'
    Audience:
      type: string
      enum: [rd, mgmt]
      description: '`rd` engineering work, `mgmt` collaboration work.'
    Origin:
      type: string
      enum: [repo, upload, web]
      description: Where the content comes from - a resource repository, an uploaded archive, or a form on the web.
    ResourceStatus:
      type: string
      enum: [draft, published, disabled]
      description: '`draft` - never published; `published` - live (it may also have a newer draft); `disabled` - taken off every computer.'
    UserStatus:
      type: string
      enum: [active, pending, disabled]
      description: '`pending` - signed in through SSO or GitLab but not yet in any product.'
    Role:
      type: string
      enum: [owner, member]
    UserRef:
      type: object
      required: [id, username, display_name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        username: { type: string }
        display_name: { type: string }
    ProductRef:
      type: object
      required: [code, name]
      properties:
        code: { $ref: '#/components/schemas/ProductCode' }
        name: { type: string }
    ResourceRef:
      type: object
      required: [code, kind, name]
      properties:
        code: { $ref: '#/components/schemas/ResourceCode' }
        kind: { $ref: '#/components/schemas/Kind' }
        name: { type: string }
    Problem:
      type: object
      description: An error (RFC 9457) with this API's extensions.
      required: [type, title, status, code]
      properties:
        type: { type: string, description: Always `about:blank`; `code` identifies the problem. }
        title: { type: string, description: The HTTP status phrase. }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, description: 'What went wrong, in the request''s language. For people; never parse it.' }
        code: { type: string, pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$', description: 'Stable identifier: `<area>.<reason>`.', example: resource.check_blocked }
        params: { type: object, additionalProperties: true, description: 'Values the message is built from, by name.' }
        errors:
          type: array
          description: For `request.invalid`, one entry per offending field.
          items: { $ref: '#/components/schemas/FieldError' }
        request_id: { type: string, description: The id of this request in the server log. }
    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string, description: 'Where in the request: a JSON path into the body (`meta.stages[1]`), or a parameter name.' }
        code: { type: string, description: 'What is wrong: `required`, `too_long`, `pattern`, `enum`, `unknown`…' }
        detail: { type: string }

    # ------------------------------------------------------------------ meta
    ServerMeta:
      type: object
      required: [version, api, setup_complete, default_locale, locales, login_methods, modules, cli, limits]
      properties:
        version: { type: string, description: The server's version. }
        api: { type: string, enum: [v1] }
        organization: { type: string, description: 'The organisation''s display name, when set.' }
        setup_complete: { type: boolean, description: False until the first-run wizard is closed; the console then shows the wizard. }
        default_locale: { type: string, example: en }
        locales: { type: array, items: { type: string }, description: Languages the console and messages are available in. }
        login_methods:
          type: array
          description: Enabled sign-in methods, in display order.
          items: { $ref: '#/components/schemas/LoginMethod' }
        modules: { type: array, items: { type: string }, description: Ids of the enabled optional modules; their pages and `/api/v1/x/<id>/` routes exist. }
        cli: { $ref: '#/components/schemas/CLIVersions' }
        limits:
          type: object
          required: [max_bundle_bytes]
          properties:
            max_bundle_bytes: { type: integer, description: The largest bundle an upload may be. }
    LoginMethod:
      type: object
      required: [id, kind, name]
      properties:
        id: { type: string, description: '`local`, or the provider id for `/auth/providers/{id}/start`.' }
        kind: { type: string, description: '`local`, `oidc`, `gitlab`, or another identity provider kind.' }
        name: { type: string }
    CLIVersions:
      type: object
      required: [min_version, latest_version]
      properties:
        min_version: { $ref: '#/components/schemas/SemVer' }
        latest_version: { $ref: '#/components/schemas/SemVer' }
    Stage:
      type: object
      required: [id, name, hidden]
      properties:
        id: { $ref: '#/components/schemas/StageId' }
        name: { type: string, description: Translated display name. }
        description: { type: string }
        hidden: { type: boolean, description: Hidden stages stay valid for resources that name them but are not offered for new ones. }
    StageList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Stage' } }

    # ----------------------------------------------------------------- setup
    SetupStatus:
      type: object
      required: [admin_created, setup_token_required]
      properties:
        admin_created: { type: boolean, description: 'Once true, the remaining steps run as that administrator.' }
        setup_token_required: { type: boolean, description: Always true for now; there for a future unattended mode. }
    SetupAdminRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{1,31}$' }
        display_name: { type: string, maxLength: 64 }
        email: { type: string, format: email }
        password: { type: string, minLength: 12, maxLength: 256 }

    # ------------------------------------------------------------------ auth
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 64 }
        password: { type: string, maxLength: 256 }
    InvitePreview:
      type: object
      required: [email, products, expires_at]
      properties:
        email: { type: string, format: email }
        products: { type: array, items: { $ref: '#/components/schemas/ProductRef' } }
        expires_at: { type: string, format: date-time }
    AcceptInviteRequest:
      type: object
      required: [username, display_name, password]
      properties:
        username: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{1,31}$' }
        display_name: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 12, maxLength: 256 }

    # -------------------------------------------------------------------- me
    Me:
      type: object
      required: [id, username, display_name, status, platform_admin, focus_stages, locale, memberships]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        username: { type: string }
        display_name: { type: string }
        email: { type: string, format: email }
        status: { $ref: '#/components/schemas/UserStatus' }
        platform_admin: { type: boolean }
        job: { type: string, description: 'Free text such as "Developer". Decides defaults only, never permissions.' }
        focus_stages: { type: array, items: { $ref: '#/components/schemas/StageId' } }
        locale: { type: string, description: The language the console and notifications use for this person. }
        memberships: { type: array, items: { $ref: '#/components/schemas/Membership' } }
    Membership:
      type: object
      required: [product, role]
      properties:
        product: { $ref: '#/components/schemas/ProductRef' }
        role: { $ref: '#/components/schemas/Role' }
    UpdateMeRequest:
      type: object
      properties:
        display_name: { type: string, minLength: 1, maxLength: 64 }
        job: { type: string, maxLength: 32 }
        focus_stages: { type: array, maxItems: 16, items: { $ref: '#/components/schemas/StageId' } }
        locale: { type: string, maxLength: 35 }
    Device:
      type: object
      required: [id, name, os, arch, cli_version, key_storage, current, created_at, last_seen_at, tools]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, description: The computer's name as the command line reported it. }
        os: { type: string, enum: [darwin, linux, windows] }
        arch: { type: string, example: arm64 }
        cli_version: { $ref: '#/components/schemas/SemVer' }
        key_storage: { type: string, enum: [keyring, file], description: Where the device key lives; `file` means the system keychain was not available. }
        current: { type: boolean, description: True for the device making this request. }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        last_sync: { $ref: '#/components/schemas/LastSync' }
        tools: { type: array, description: 'AI tools detected at the last sync, without paths.', items: { $ref: '#/components/schemas/DetectedTool' } }
    LastSync:
      type: object
      required: [at, result]
      properties:
        at: { type: string, format: date-time }
        result: { $ref: '#/components/schemas/SyncResult' }
        changes: { type: integer, minimum: 0, description: How many places were written or removed. }
    SyncResult:
      type: string
      enum: [ok, partial, failed]
    DetectedTool:
      type: object
      required: [tool]
      properties:
        tool: { $ref: '#/components/schemas/ToolId' }
        version: { type: string, description: As the tool reported it; absent when unknown. }
    DeviceList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Device' } }
    TokenScope:
      type: string
      enum: [read, publish]
      description: '`read` - fetch the desired state, bundles and the catalog; `publish` - also manage drafts and publish.'
    AccessToken:
      type: object
      required: [id, name, prefix, scope, created_at, expires_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        prefix: { type: string, description: 'The first characters, to recognise it.' }
        scope: { $ref: '#/components/schemas/TokenScope' }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
    AccessTokenList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AccessToken' } }
    CreateAccessTokenRequest:
      type: object
      required: [name, scope, expires_in_days]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        scope: { $ref: '#/components/schemas/TokenScope' }
        expires_in_days: { type: integer, minimum: 1, maximum: 366 }
    CreatedAccessToken:
      type: object
      required: [token, access_token]
      properties:
        token: { type: string, description: The plain token. Shown this once; the server keeps only a digest. }
        access_token: { $ref: '#/components/schemas/AccessToken' }
    MySecret:
      type: object
      required: [name, label, used_by, configured]
      properties:
        name: { $ref: '#/components/schemas/SecretName' }
        label: { type: string }
        howto: { type: string, description: 'Where to get one, as the resource''s maintainer wrote it.' }
        used_by: { type: array, items: { $ref: '#/components/schemas/ResourceRef' } }
        configured: { type: boolean }
        updated_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, description: 'When the secret stops working, if known.' }
    MySecretList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MySecret' } }
    SetSecretRequest:
      type: object
      required: [value]
      properties:
        value: { type: string, minLength: 1, maxLength: 8192 }
        expires_at: { type: string, format: date-time }
    JoinRequestStatus:
      type: string
      enum: [pending, approved, rejected]
    JoinRequest:
      type: object
      required: [id, user, product, status, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        user: { $ref: '#/components/schemas/UserRef' }
        job: { type: string }
        focus_stages: { type: array, items: { $ref: '#/components/schemas/StageId' } }
        identity: { type: string, description: The sign-in method the person came through. }
        product: { $ref: '#/components/schemas/ProductRef' }
        note: { type: string }
        status: { $ref: '#/components/schemas/JoinRequestStatus' }
        created_at: { type: string, format: date-time }
        decided_by: { $ref: '#/components/schemas/UserRef' }
        decided_at: { type: string, format: date-time }
        reason: { type: string, description: Why it was rejected. }
    JoinRequestList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/JoinRequest' } }
    CreateJoinRequestsRequest:
      type: object
      required: [products]
      properties:
        products: { type: array, minItems: 1, maxItems: 16, items: { $ref: '#/components/schemas/ProductCode' } }
        note: { type: string, maxLength: 500 }
    Notification:
      type: object
      required: [id, kind, title, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { type: string, description: 'The event, such as `resource.published` or `feedback.status_changed`.' }
        title: { type: string }
        body: { type: string }
        link: { type: string, description: A path in the console. }
        created_at: { type: string, format: date-time }
        read_at: { type: string, format: date-time }
    NotificationPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        next_cursor: { type: string }
    MarkNotificationsReadRequest:
      type: object
      description: Either `ids`, or `all` to mark everything read.
      properties:
        ids: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/Id' } }
        all: { type: boolean }

    # ---------------------------------------------------------------- device
    DeviceCodeRequest:
      type: object
      required: [name, os, arch, cli_version, public_key, key_storage]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        os: { type: string, enum: [darwin, linux, windows] }
        arch: { type: string, maxLength: 16 }
        cli_version: { $ref: '#/components/schemas/SemVer' }
        public_key: { type: string, description: 'The device''s X25519 public key, unpadded base64url (32 bytes).', pattern: '^[A-Za-z0-9_-]{43}$' }
        key_storage: { type: string, enum: [keyring, file] }
    DeviceCode:
      type: object
      required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval]
      properties:
        device_code: { type: string }
        user_code: { type: string, description: 'Eight characters without look-alikes, shown with a hyphen.' }
        verification_uri: { type: string, format: uri }
        verification_uri_complete: { type: string, format: uri }
        expires_in: { type: integer, description: Seconds. }
        interval: { type: integer, description: Seconds between polls. }
    DeviceTokenRequest:
      type: object
      required: [device_code]
      properties:
        device_code: { type: string, maxLength: 256 }
    DeviceToken:
      type: object
      required: [device_token, device_id, user]
      properties:
        device_token: { type: string }
        device_id: { $ref: '#/components/schemas/Id' }
        user: { $ref: '#/components/schemas/UserRef' }
    DeviceRequest:
      type: object
      required: [user_code, name, os, arch, cli_version, status, requested_at, expires_at]
      properties:
        user_code: { type: string }
        name: { type: string }
        os: { type: string }
        arch: { type: string }
        cli_version: { type: string }
        status: { type: string, enum: [pending, approved, denied, expired] }
        requested_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    # --------------------------------------------------------------- catalog
    ResourceMeta:
      type: object
      description: |
        The metadata every resource carries (meta.yaml in the repository, see
        the repository format's JSON Schema), as in effect: repository values
        with platform overrides applied.
      required: [name]
      properties:
        name: { type: string }
        summary: { type: string }
        stages: { type: array, items: { $ref: '#/components/schemas/StageId' } }
        audience: { $ref: '#/components/schemas/Audience' }
        scope: { $ref: '#/components/schemas/Scope' }
        policy: { $ref: '#/components/schemas/Policy' }
        when: { type: string }
        try: { type: string }
        secrets: { type: array, items: { $ref: '#/components/schemas/SecretName' } }
        maintainers: { type: array, items: { type: string }, description: Usernames. }
        tags: { type: array, items: { type: string } }
        i18n:
          type: object
          description: Translations of the fields people read, by language tag.
          additionalProperties: { $ref: '#/components/schemas/ResourceMetaText' }
    ResourceMetaText:
      type: object
      properties:
        name: { type: string }
        summary: { type: string }
        when: { type: string }
        try: { type: string }
    SecretNeed:
      type: object
      required: [name, configured]
      properties:
        name: { $ref: '#/components/schemas/SecretName' }
        configured: { type: boolean, description: Whether the caller has set it. }
    Delivery:
      type: string
      enum: [native, on_demand]
      description: For MCP servers - `native` writes an entry into each tool's MCP configuration; `on_demand` installs a skill and calls through the command line.
    CatalogItem:
      type: object
      required: [code, kind, name, stages, audience, scope, policy, origin, version, enabled, installed_people]
      properties:
        code: { $ref: '#/components/schemas/ResourceCode' }
        kind: { $ref: '#/components/schemas/Kind' }
        name: { type: string }
        summary: { type: string }
        stages: { type: array, items: { $ref: '#/components/schemas/StageId' } }
        audience: { $ref: '#/components/schemas/Audience' }
        scope: { $ref: '#/components/schemas/Scope' }
        policy: { $ref: '#/components/schemas/Policy' }
        origin: { $ref: '#/components/schemas/Origin' }
        version: { type: integer, minimum: 1, description: The live version. }
        enabled: { type: boolean, description: 'Whether it is on for the caller, after policy and their own choice.' }
        installed_people: { type: integer, minimum: 0, description: How many people have it installed on at least one computer. }
        secrets: { type: array, items: { $ref: '#/components/schemas/SecretNeed' } }
        delivery: { $ref: '#/components/schemas/Delivery' }
    CatalogList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CatalogItem' } }
    CatalogResource:
      type: object
      required: [code, kind, name, stages, audience, scope, policy, origin, version, enabled, installed_people, digest, published_at, files, definition, references, referenced_by, my_installs]
      properties:
        code: { $ref: '#/components/schemas/ResourceCode' }
        kind: { $ref: '#/components/schemas/Kind' }
        name: { type: string }
        summary: { type: string }
        stages: { type: array, items: { $ref: '#/components/schemas/StageId' } }
        audience: { $ref: '#/components/schemas/Audience' }
        scope: { $ref: '#/components/schemas/Scope' }
        policy: { $ref: '#/components/schemas/Policy' }
        origin: { $ref: '#/components/schemas/Origin' }
        version: { type: integer, minimum: 1 }
        enabled: { type: boolean }
        installed_people: { type: integer, minimum: 0 }
        secrets: { type: array, items: { $ref: '#/components/schemas/SecretNeed' } }
        delivery: { $ref: '#/components/schemas/Delivery' }
        when: { type: string }
        try: { type: string, description: A sentence to send to one's AI tool to see it work. }
        maintainers: { type: array, items: { $ref: '#/components/schemas/UserRef' } }
        digest: { $ref: '#/components/schemas/Digest' }
        published_at: { type: string, format: date-time }
        files: { type: array, items: { $ref: '#/components/schemas/ResourceFile' } }
        definition:
          $ref: '#/components/schemas/Definition'
        references: { type: array, description: 'Resources this one uses (a workflow''s steps, an agent''s bindings); they come along when it is installed.', items: { $ref: '#/components/schemas/ResourceRef' } }
        referenced_by: { type: array, items: { $ref: '#/components/schemas/ResourceRef' } }
        local_config: { type: array, description: Settings each computer fills in for itself (from `.env.example`); their values never reach the server., items: { $ref: '#/components/schemas/LocalConfigItem' } }
        my_installs: { type: array, description: 'Where it is on the caller''s computers, per tool.', items: { $ref: '#/components/schemas/Install' } }
    Definition:
      type: object
      additionalProperties: true
      description: |
        The kind's own document as it is in the repository (for example the
        contents of `mcp/<code>.yaml` or `workflows/<code>.yaml`), parsed. Its
        shape is that kind's JSON Schema; kinds are an extension point, so
        the API does not spell it out. Secrets appear only as
        `${secret:NAME}` references. Empty for directory-shaped kinds such as
        skills, whose content is in `files`.
    ResourceFile:
      type: object
      required: [path, size]
      properties:
        path: { type: string }
        size: { type: integer, minimum: 0 }
    LocalConfigItem:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
    InstallStatus:
      type: string
      enum: [installed, failed, skipped, removed]
    Install:
      type: object
      required: [device_id, device_name, tool, version, status, degraded]
      properties:
        device_id: { $ref: '#/components/schemas/Id' }
        device_name: { type: string }
        tool: { $ref: '#/components/schemas/ToolId' }
        version: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/InstallStatus' }
        degraded: { type: boolean, description: 'Delivered in another form because the tool lacks this one (a workflow as a skill, say).' }
        form: { type: string, description: The form it was delivered in when degraded. }
    PreferenceRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    Preference:
      type: object
      required: [code, enabled, policy]
      properties:
        code: { $ref: '#/components/schemas/ResourceCode' }
        enabled: { type: boolean }
        policy: { $ref: '#/components/schemas/Policy' }

    # ------------------------------------------------------------------ sync
    DesiredState:
      type: object
      required: [generated_at, user, cli, defaults, resources, secrets]
      properties:
        generated_at: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/UserRef' }
        cli: { $ref: '#/components/schemas/CLIVersions' }
        defaults: { $ref: '#/components/schemas/OrgDefaults' }
        resources: { type: array, items: { $ref: '#/components/schemas/DesiredResource' } }
        secrets: { type: array, description: 'The secrets the resources above need, and whether the person has set them. Values come only from `/sync/secrets`.', items: { $ref: '#/components/schemas/DesiredSecret' } }
    OrgDefaults:
      type: object
      description: |
        Organisation-wide defaults the command line applies below its own
        flags, environment and configuration file. Where privacy or which
        tools to write to is concerned, the stricter of the two sides wins.
      required: [tools_disabled, mcp_mode]
      properties:
        tools_disabled: { type: array, items: { $ref: '#/components/schemas/ToolId' } }
        mcp_mode: { type: string, enum: [single-entry, direct], description: How MCP servers are written into tools by default. }
    DesiredResource:
      type: object
      required: [code, kind, version, digest, bundle, size, reason, meta]
      properties:
        code: { $ref: '#/components/schemas/ResourceCode' }
        kind: { $ref: '#/components/schemas/Kind' }
        version: { type: integer, minimum: 1 }
        digest: { $ref: '#/components/schemas/Digest' }
        bundle: { $ref: '#/components/schemas/Digest' }
        size: { type: integer, minimum: 0, description: The bundle's size in bytes. }
        reason: { type: string, enum: [policy, enabled, dependency], description: 'Why it is here: its policy, the person turned it on, or another resource needs it.' }
        required_by: { type: array, description: 'With reason `dependency`, the resources that need it.', items: { $ref: '#/components/schemas/ResourceCode' } }
        delivery: { $ref: '#/components/schemas/Delivery' }
        meta: { $ref: '#/components/schemas/ResourceMeta' }
    DesiredSecret:
      type: object
      required: [name, configured]
      properties:
        name: { $ref: '#/components/schemas/SecretName' }
        configured: { type: boolean }
        version: { type: integer, minimum: 1, description: Changes every time the value is replaced. }
    SealedSecretsRequest:
      type: object
      properties:
        names: { type: array, maxItems: 200, description: Only these. All of the person's secrets when absent., items: { $ref: '#/components/schemas/SecretName' } }
    SealedSecrets:
      type: object
      required: [device_id, suite, items, missing]
      properties:
        device_id: { $ref: '#/components/schemas/Id' }
        suite: { type: string, enum: [hpke-x25519-sha256-aes256gcm], description: The HPKE cipher suite. }
        items: { type: array, items: { $ref: '#/components/schemas/SealedSecret' } }
        missing: { type: array, description: Asked for but not set., items: { $ref: '#/components/schemas/SecretName' } }
    SealedSecret:
      type: object
      required: [name, version, enc, ciphertext, info]
      properties:
        name: { $ref: '#/components/schemas/SecretName' }
        version: { type: integer, minimum: 1 }
        enc: { type: string, description: 'HPKE encapsulated key, base64url.' }
        ciphertext: { type: string, description: 'The sealed value, base64url.' }
        info: { type: string, description: 'The HPKE info the value was sealed with; it binds user, device, name and version.' }
        expires_at: { type: string, format: date-time }
    SyncReport:
      type: object
      required: [cli_version, os, arch, finished_at, result, tools, installs]
      properties:
        cli_version: { $ref: '#/components/schemas/SemVer' }
        os: { type: string, enum: [darwin, linux, windows] }
        arch: { type: string, maxLength: 16 }
        finished_at: { type: string, format: date-time }
        result: { $ref: '#/components/schemas/SyncResult' }
        tools: { type: array, maxItems: 64, items: { $ref: '#/components/schemas/DetectedTool' } }
        installs: { type: array, maxItems: 4096, items: { $ref: '#/components/schemas/InstallReport' } }
    InstallReport:
      type: object
      required: [code, version, tool, status]
      properties:
        code: { $ref: '#/components/schemas/ResourceCode' }
        version: { type: integer, minimum: 1 }
        tool: { $ref: '#/components/schemas/ToolId' }
        status: { $ref: '#/components/schemas/InstallStatus' }
        degraded: { type: boolean }
        form: { type: string, maxLength: 32 }
        reason: { type: string, maxLength: 64, description: 'For `skipped` and `failed`, a stable code such as `secret_missing`, `name_taken`, `config_unreadable`. Never a path.' }
    InstallsSummary:
      type: object
      required: [people_connected, devices_active, required_complete, by_tool, cli_versions]
      properties:
        people_connected: { type: integer, minimum: 0 }
        devices_active: { type: integer, minimum: 0 }
        required_complete:
          type: object
          description: People who have every required resource of their scope installed, of those connected.
          required: [people, of]
          properties:
            people: { type: integer, minimum: 0 }
            of: { type: integer, minimum: 0 }
        by_tool: { type: array, items: { $ref: '#/components/schemas/ToolCount' } }
        cli_versions: { type: array, items: { $ref: '#/components/schemas/VersionCount' } }
    ToolCount:
      type: object
      required: [tool, people]
      properties:
        tool: { $ref: '#/components/schemas/ToolId' }
        people: { type: integer, minimum: 0 }
    VersionCount:
      type: object
      required: [version, people]
      properties:
        version: { type: string }
        people: { type: integer, minimum: 0 }

    # ------------------------------------------------------------- resources
    CheckCounts:
      type: object
      required: [blocking, advisory]
      properties:
        blocking: { type: integer, minimum: 0, description: Must-fix findings that are not waived. Publishing needs zero. }
        advisory: { type: integer, minimum: 0, description: Should-fix findings. They never block. }
    ResourceSummary:
      type: object
      required: [code, kind, name, stages, audience, scope, policy, origin, status, has_draft, checks, updated_at]
      properties:
        code: { $ref: '#/components/schemas/ResourceCode' }
        kind: { $ref: '#/components/schemas/Kind' }
        name: { type: string }
        summary: { type: string }
        stages: { type: array, items: { $ref: '#/components/schemas/StageId' } }
        audience: { $ref: '#/components/schemas/Audience' }
        scope: { $ref: '#/components/schemas/Scope' }
        policy: { $ref: '#/components/schemas/Policy' }
        origin: { $ref: '#/components/schemas/Origin' }
        status: { $ref: '#/components/schemas/ResourceStatus' }
        version: { type: integer, minimum: 1, description: The live version; absent before the first publish. }
        has_draft: { type: boolean, description: A draft is waiting to be published. }
        checks: { $ref: '#/components/schemas/CheckCounts' }
        updated_at: { type: string, format: date-time }
    ResourceList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ResourceSummary' } }
    ManagedResource:
      type: object
      required: [code, kind, name, stages, audience, scope, policy, origin, status, has_draft, checks, updated_at, maintainers, overrides, secrets, references, created_at, etag]
      properties:
        code: { $ref: '#/components/schemas/ResourceCode' }
        kind: { $ref: '#/components/schemas/Kind' }
        name: { type: string }
        summary: { type: string }
        stages: { type: array, items: { $ref: '#/components/schemas/StageId' } }
        audience: { $ref: '#/components/schemas/Audience' }
        scope: { $ref: '#/components/schemas/Scope' }
        policy: { $ref: '#/components/schemas/Policy' }
        origin: { $ref: '#/components/schemas/Origin' }
        status: { $ref: '#/components/schemas/ResourceStatus' }
        version: { type: integer, minimum: 1 }
        has_draft: { type: boolean }
        checks: { $ref: '#/components/schemas/CheckCounts' }
        updated_at: { type: string, format: date-time }
        when: { type: string }
        try: { type: string }
        delivery: { $ref: '#/components/schemas/Delivery' }
        maintainers: { type: array, items: { $ref: '#/components/schemas/UserRef' } }
        overrides: { type: array, description: Fields set on the platform that the repository no longer controls., items: { $ref: '#/components/schemas/OverridableField' } }
        repository_differs: { type: array, description: Overridden fields whose repository value has since changed., items: { $ref: '#/components/schemas/OverridableField' } }
        secrets: { type: array, items: { $ref: '#/components/schemas/SecretName' } }
        references: { type: array, items: { $ref: '#/components/schemas/ResourceRef' } }
        source: { $ref: '#/components/schemas/ResourceSource' }
        disabled_reason: { type: string }
        published_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        etag: { $ref: '#/components/schemas/Etag' }
    ResourceSource:
      type: object
      required: [id, name, path]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        path: { type: string, description: The resource's place in the repository. }
        commit: { type: string, description: The commit of the last import. }
    OverridableField:
      type: string
      enum: [name, summary, stages, audience, scope, policy, when, try, maintainers, delivery]
    UpdateResourceRequest:
      type: object
      description: Only the fields present change.
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        summary: { type: string, maxLength: 500 }
        stages: { type: array, maxItems: 16, items: { $ref: '#/components/schemas/StageId' } }
        audience: { $ref: '#/components/schemas/Audience' }
        scope: { $ref: '#/components/schemas/Scope' }
        policy: { $ref: '#/components/schemas/Policy' }
        when: { type: string, maxLength: 200 }
        try: { type: string, maxLength: 200 }
        maintainers: { type: array, maxItems: 32, description: User ids., items: { $ref: '#/components/schemas/Id' } }
        delivery: { $ref: '#/components/schemas/Delivery' }
        reset: { type: array, description: Drop these overrides and take the repository's values again., items: { $ref: '#/components/schemas/OverridableField' } }
    Draft:
      type: object
      required: [code, kind, digest, meta, definition, files, checks, updated_at, etag]
      properties:
        code: { $ref: '#/components/schemas/ResourceCode' }
        kind: { $ref: '#/components/schemas/Kind' }
        digest: { $ref: '#/components/schemas/Digest' }
        meta: { $ref: '#/components/schemas/ResourceMeta' }
        definition: { $ref: '#/components/schemas/Definition' }
        files: { type: array, items: { $ref: '#/components/schemas/ResourceFile' } }
        checks: { $ref: '#/components/schemas/CheckReport' }
        base_version: { type: integer, minimum: 1, description: The live version the draft would replace. }
        source_commit: { type: string, description: The repository commit it was imported from. }
        updated_by: { $ref: '#/components/schemas/UserRef' }
        updated_at: { type: string, format: date-time }
        etag: { $ref: '#/components/schemas/Etag' }
    PutDraftRequest:
      type: object
      required: [kind, meta, definition]
      properties:
        kind: { $ref: '#/components/schemas/Kind' }
        meta: { $ref: '#/components/schemas/ResourceMeta' }
        definition: { $ref: '#/components/schemas/Definition' }
    DraftDiff:
      type: object
      required: [files]
      properties:
        base_version: { type: integer, minimum: 1, description: Absent when nothing was published yet. }
        files: { type: array, items: { $ref: '#/components/schemas/FileChange' } }
    FileChange:
      type: object
      required: [path, change]
      properties:
        path: { type: string }
        change: { type: string, enum: [added, removed, modified] }
        unified: { type: string, description: Unified diff for text files that were modified. }
    CheckReport:
      type: object
      required: [ruleset, blocking, advisory, findings]
      properties:
        ruleset: { type: integer, minimum: 1, description: The rule set version the content was checked against. }
        blocking: { type: integer, minimum: 0 }
        advisory: { type: integer, minimum: 0 }
        findings: { type: array, items: { $ref: '#/components/schemas/Finding' } }
    Severity:
      type: string
      enum: [must_fix, should_fix]
    Finding:
      type: object
      required: [id, rule, severity, message]
      properties:
        id: { type: string, description: 'Stable for the same rule, file and line content; what a waiver refers to.' }
        rule: { type: string }
        severity: { $ref: '#/components/schemas/Severity' }
        message: { type: string, description: Translated. }
        file: { type: string }
        line: { type: integer, minimum: 1 }
        first_seen_at: { type: string, format: date-time, description: 'When this finding first appeared, for "present for N weeks".' }
        waiver: { $ref: '#/components/schemas/Waiver' }
    Waiver:
      type: object
      required: [id, rule, reason, by, at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        rule: { type: string }
        reason: { type: string }
        by: { $ref: '#/components/schemas/UserRef' }
        at: { type: string, format: date-time }
    WaiverRequest:
      type: object
      required: [finding, reason]
      properties:
        finding: { type: string, description: The finding's id. }
        reason: { type: string, minLength: 1, maxLength: 500 }
    RuleSet:
      type: object
      required: [version, rules]
      properties:
        version: { type: integer, minimum: 1 }
        rules: { type: array, items: { $ref: '#/components/schemas/CheckRule' } }
    CheckRule:
      type: object
      required: [id, severity, name, description]
      properties:
        id: { type: string }
        severity: { $ref: '#/components/schemas/Severity' }
        name: { type: string }
        description: { type: string }
        waivable: { type: boolean }
    ResourceVersion:
      type: object
      required: [number, digest, bundle, ruleset, checks, published_by, published_at]
      properties:
        number: { type: integer, minimum: 1 }
        digest: { $ref: '#/components/schemas/Digest' }
        bundle: { $ref: '#/components/schemas/Digest' }
        note: { type: string }
        source_commit: { type: string }
        rollback_of: { type: integer, minimum: 1, description: 'For a rollback, the version whose content was published again.' }
        ruleset: { type: integer, minimum: 1 }
        checks: { $ref: '#/components/schemas/CheckCounts' }
        findings: { type: array, description: In single-version responses only., items: { $ref: '#/components/schemas/Finding' } }
        meta: { $ref: '#/components/schemas/ResourceMeta' }
        published_by: { $ref: '#/components/schemas/UserRef' }
        published_at: { type: string, format: date-time }
    ResourceVersionPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ResourceVersion' } }
        next_cursor: { type: string }
    PublishRequest:
      type: object
      properties:
        note: { type: string, maxLength: 500 }
    RollbackRequest:
      type: object
      required: [to_version]
      properties:
        to_version: { type: integer, minimum: 1 }
        note: { type: string, maxLength: 500 }
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    Impact:
      type: object
      required: [people, devices, referenced_by]
      properties:
        people: { type: integer, minimum: 0, description: People who have it now and would lose it. }
        devices: { type: integer, minimum: 0 }
        referenced_by: { type: array, description: Workflows and agents that use it., items: { $ref: '#/components/schemas/ResourceRef' } }

    # --------------------------------------------------------------- sources
    Source:
      type: object
      required: [id, name, url, branch, dir, order, has_credential, resource_count, etag]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        url: { type: string, description: An https or ssh Git address. }
        branch: { type: string }
        dir: { type: string, description: Sub-directory holding the repository's configuration file; empty for the root. }
        order: { type: integer, minimum: 1 }
        has_credential: { type: boolean }
        resource_count: { type: integer, minimum: 0 }
        last_pull: { $ref: '#/components/schemas/SourcePull' }
        etag: { $ref: '#/components/schemas/Etag' }
    SourcePull:
      type: object
      required: [at, result]
      properties:
        at: { type: string, format: date-time }
        result: { type: string, enum: [ok, failed, running] }
        commit: { type: string }
        imported: { type: integer, minimum: 0, description: Drafts created or updated by this pull. }
        failed: { type: integer, minimum: 0, description: Resources that could not be read; the others were imported. }
        error: { type: string, description: 'Why the pull failed, with credentials masked.' }
        last_success_at: { type: string, format: date-time }
    SourceList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Source' } }
    CreateSourceRequest:
      type: object
      required: [name, url, branch]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        url: { type: string, minLength: 1, maxLength: 1024 }
        branch: { type: string, minLength: 1, maxLength: 255 }
        dir: { type: string, maxLength: 255 }
        credential: { type: string, maxLength: 8192, description: 'A read-only token. Encrypted, never returned.' }
    UpdateSourceRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        url: { type: string, minLength: 1, maxLength: 1024 }
        branch: { type: string, minLength: 1, maxLength: 255 }
        dir: { type: string, maxLength: 255 }
        credential: { type: string, maxLength: 8192 }
        clear_credential: { type: boolean }
    SourceOrderRequest:
      type: object
      required: [ids]
      properties:
        ids: { type: array, description: 'Every source, in the new order.', items: { $ref: '#/components/schemas/Id' } }

    # -------------------------------------------------------------- products
    Product:
      type: object
      required: [code, name, owners, member_count, resource_count]
      properties:
        code: { $ref: '#/components/schemas/ProductCode' }
        name: { type: string }
        line: { type: string, description: 'The product line, a grouping label.' }
        owners: { type: array, items: { $ref: '#/components/schemas/UserRef' } }
        member_count: { type: integer, minimum: 0 }
        resource_count: { type: integer, minimum: 0, description: Resources scoped to this product. }
        my_role: { $ref: '#/components/schemas/Role' }
    ProductList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Product' } }
    CreateProductRequest:
      type: object
      required: [code, name]
      properties:
        code: { $ref: '#/components/schemas/ProductCode' }
        name: { type: string, minLength: 1, maxLength: 64 }
        line: { type: string, maxLength: 64 }
        owners: { type: array, maxItems: 16, description: User ids. Can be empty and filled in later., items: { $ref: '#/components/schemas/Id' } }
    UpdateProductRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        line: { type: string, maxLength: 64 }
    Member:
      type: object
      required: [user, role, added_at]
      properties:
        user: { $ref: '#/components/schemas/UserRef' }
        role: { $ref: '#/components/schemas/Role' }
        job: { type: string }
        focus_stages: { type: array, items: { $ref: '#/components/schemas/StageId' } }
        added_at: { type: string, format: date-time }
    MemberList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Member' } }
    PutMemberRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/Role' }

    # ----------------------------------------------------------------- users
    User:
      type: object
      required: [id, username, display_name, status, platform_admin, focus_stages, memberships, identities, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        username: { type: string }
        display_name: { type: string }
        email: { type: string, format: email }
        email_verified: { type: boolean }
        status: { $ref: '#/components/schemas/UserStatus' }
        platform_admin: { type: boolean }
        job: { type: string }
        focus_stages: { type: array, items: { $ref: '#/components/schemas/StageId' } }
        memberships: { type: array, items: { $ref: '#/components/schemas/Membership' } }
        identities: { type: array, description: Ids of the sign-in methods this account has used (`local` included)., items: { type: string } }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time }
    UserList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/User' } }
    UpdateUserRequest:
      type: object
      properties:
        status: { type: string, enum: [active, disabled] }
        platform_admin: { type: boolean }
    Invite:
      type: object
      required: [id, email, products, created_by, created_at, expires_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: string, format: email }
        products: { type: array, items: { $ref: '#/components/schemas/ProductRef' } }
        created_by: { $ref: '#/components/schemas/UserRef' }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        link: { type: string, format: uri, description: 'Present only in the response that created it, and only when mail is not configured.' }
    InviteList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Invite' } }
    CreateInvitesRequest:
      type: object
      required: [emails]
      properties:
        emails: { type: array, minItems: 1, maxItems: 100, items: { type: string, format: email } }
        products: { type: array, maxItems: 16, items: { $ref: '#/components/schemas/ProductCode' } }
    IdentityProvider:
      type: object
      required: [id, kind, name, enabled, config, has_client_secret, etag]
      properties:
        id: { type: string }
        kind: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        config: { type: object, additionalProperties: true, description: 'The non-secret settings, shaped by the kind''s `config_schema`.' }
        has_client_secret: { type: boolean }
        etag: { $ref: '#/components/schemas/Etag' }
    IdentityProviderList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/IdentityProvider' } }
    IdentityProviderKind:
      type: object
      required: [kind, name, config_schema]
      properties:
        kind: { type: string }
        name: { type: string }
        config_schema: { type: object, additionalProperties: true, description: A JSON Schema (draft 2020-12). }
    IdentityProviderKindList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/IdentityProviderKind' } }
    CreateIdentityProviderRequest:
      type: object
      required: [kind, name, config]
      properties:
        kind: { type: string }
        name: { type: string, minLength: 1, maxLength: 64 }
        enabled: { type: boolean, default: true }
        config: { type: object, additionalProperties: true }
        client_secret: { type: string, maxLength: 8192 }
    UpdateIdentityProviderRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        enabled: { type: boolean }
        config: { type: object, additionalProperties: true }
        client_secret: { type: string, maxLength: 8192 }

    # -------------------------------------------------------------- feedback
    FeedbackType:
      type: string
      enum: [bug, suggestion, question, friction]
      description: '`friction` is created by the system from usage data, never submitted.'
    FeedbackStatus:
      type: string
      enum: [new, accepted, in_progress, resolved, wont_fix]
    FeedbackOrigin:
      type: string
      enum: [web, ai, cli, system]
      description: '`ai` - drafted by an AI tool and confirmed by the person before submitting.'
    FeedbackSeverity:
      type: string
      enum: [low, medium, high]
    FeedbackListItem:
      type: object
      required: [number, title, type, origin, status, severity, created_at, updated_at]
      properties:
        number: { type: integer, minimum: 1, description: Shown as FB-<number>. }
        title: { type: string }
        type: { $ref: '#/components/schemas/FeedbackType' }
        origin: { $ref: '#/components/schemas/FeedbackOrigin' }
        status: { $ref: '#/components/schemas/FeedbackStatus' }
        severity: { $ref: '#/components/schemas/FeedbackSeverity' }
        submitter: { $ref: '#/components/schemas/UserRef' }
        assignee: { $ref: '#/components/schemas/UserRef' }
        resource: { $ref: '#/components/schemas/ResourceRef' }
        resource_version: { type: integer, minimum: 1 }
        score: { type: integer, minimum: 1, maximum: 5 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FeedbackPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/FeedbackListItem' } }
        next_cursor: { type: string }
    Feedback:
      type: object
      required: [number, title, type, origin, status, severity, created_at, updated_at, body, context, events]
      properties:
        number: { type: integer, minimum: 1 }
        title: { type: string }
        type: { $ref: '#/components/schemas/FeedbackType' }
        origin: { $ref: '#/components/schemas/FeedbackOrigin' }
        status: { $ref: '#/components/schemas/FeedbackStatus' }
        severity: { $ref: '#/components/schemas/FeedbackSeverity' }
        submitter: { $ref: '#/components/schemas/UserRef' }
        assignee: { $ref: '#/components/schemas/UserRef' }
        resource: { $ref: '#/components/schemas/ResourceRef' }
        resource_version: { type: integer, minimum: 1 }
        score: { type: integer, minimum: 1, maximum: 5 }
        score_note: { type: string }
        status_reason: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        body: { type: string }
        context: { $ref: '#/components/schemas/FeedbackContext' }
        events: { type: array, description: 'The timeline, oldest first.', items: { $ref: '#/components/schemas/FeedbackEvent' } }
    FeedbackContext:
      type: object
      description: |
        The agreed context fields and nothing else. No conversation content,
        code, file paths or call arguments ever go in here.
      properties:
        page: { type: string, maxLength: 200, description: Console page the feedback was sent from. }
        browser: { type: string, maxLength: 100 }
        tool: { $ref: '#/components/schemas/ToolId' }
        tool_version: { type: string, maxLength: 64 }
        cli_version: { type: string, maxLength: 32 }
        os: { type: string, maxLength: 32 }
        last_sync: { $ref: '#/components/schemas/SyncResult' }
        frictions: { type: array, maxItems: 16, items: { $ref: '#/components/schemas/FrictionCount' } }
        trigger: { type: string, maxLength: 200, description: 'For `friction` feedback, the rule that created it.' }
    FrictionCount:
      type: object
      required: [type, count]
      properties:
        type: { type: string, enum: [tool_error, waiting_approval, repeated_correction, missing_secret, interrupted, gate_denied, sync_failed] }
        count: { type: integer, minimum: 1 }
    FeedbackEvent:
      type: object
      required: [id, kind, at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { type: string, enum: [created, comment, status, assigned, rated, reopened] }
        by: { $ref: '#/components/schemas/UserRef' }
        body: { type: string, description: 'The comment, or the reason given with a status change.' }
        status: { $ref: '#/components/schemas/FeedbackStatus' }
        assignee: { $ref: '#/components/schemas/UserRef' }
        score: { type: integer, minimum: 1, maximum: 5 }
        at: { type: string, format: date-time }
    CreateFeedbackRequest:
      type: object
      required: [type, title, body]
      properties:
        type: { type: string, enum: [bug, suggestion, question] }
        title: { type: string, minLength: 1, maxLength: 80 }
        body: { type: string, minLength: 1, maxLength: 5000 }
        severity: { $ref: '#/components/schemas/FeedbackSeverity' }
        resource: { $ref: '#/components/schemas/ResourceCode' }
        resource_version: { type: integer, minimum: 1 }
        ai_drafted: { type: boolean, description: An AI tool drafted it and the person confirmed it. }
        context: { $ref: '#/components/schemas/FeedbackContext' }
    UpdateFeedbackRequest:
      type: object
      properties:
        status: { $ref: '#/components/schemas/FeedbackStatus' }
        status_reason: { type: string, maxLength: 1000 }
        assignee: { $ref: '#/components/schemas/Id' }
        unassign: { type: boolean }
        severity: { $ref: '#/components/schemas/FeedbackSeverity' }
    CommentRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 5000 }
    RateRequest:
      type: object
      required: [score]
      properties:
        score: { type: integer, minimum: 1, maximum: 5 }
        note: { type: string, maxLength: 500 }
    FeedbackSummary:
      type: object
      required: [open, by_status]
      properties:
        open: { type: integer, minimum: 0, description: Neither resolved nor declined. }
        by_status:
          type: object
          required: [new, accepted, in_progress, resolved, wont_fix]
          properties:
            new: { type: integer, minimum: 0 }
            accepted: { type: integer, minimum: 0 }
            in_progress: { type: integer, minimum: 0 }
            resolved: { type: integer, minimum: 0 }
            wont_fix: { type: integer, minimum: 0 }

    # ----------------------------------------------------------------- audit
    AuditCategory:
      type: string
      enum: [platform, login]
      description: Optional modules add their own categories.
    AuditResult:
      type: string
      enum: [ok, denied, pending]
    AuditEntry:
      type: object
      required: [seq, at, category, origin, action, action_label, object, change, result]
      properties:
        seq: { type: integer, minimum: 1, description: 'Consecutive, never skipped.' }
        at: { type: string, format: date-time }
        category: { $ref: '#/components/schemas/AuditCategory' }
        actor: { $ref: '#/components/schemas/UserRef' }
        origin: { type: string, enum: [web, cli, system] }
        via_tool: { $ref: '#/components/schemas/ToolId' }
        device: { $ref: '#/components/schemas/AuditDevice' }
        method: { type: string, description: 'For sign-ins: `local`, `oidc`, `device_code`, `access_token`…' }
        action: { type: string, description: The stable action identifier. }
        action_label: { type: string, description: Translated. }
        object: { $ref: '#/components/schemas/AuditObject' }
        change: { type: object, additionalProperties: true, description: 'A summary of what changed. Never content, never secrets.' }
        result: { $ref: '#/components/schemas/AuditResult' }
        reason: { type: string }
    AuditDevice:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
    AuditObject:
      type: object
      required: [kind, id, label]
      properties:
        kind: { type: string }
        id: { type: string }
        label: { type: string, description: 'Its name at the time, readable even after it is renamed or gone.' }
    AuditPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
        next_cursor: { type: string }

    # -------------------------------------------------------------- settings
    PlatformSettings:
      type: object
      required: [organization, mail, etag]
      properties:
        organization:
          type: object
          required: [name]
          properties:
            name: { type: string }
        mail: { $ref: '#/components/schemas/MailSettings' }
        etag: { $ref: '#/components/schemas/Etag' }
    MailSettings:
      type: object
      required: [enabled, has_password]
      properties:
        enabled: { type: boolean }
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        security: { type: string, enum: [tls, starttls], description: '`tls` on port 465; anything else must offer STARTTLS or nothing is sent.' }
        username: { type: string }
        has_password: { type: boolean }
        from: { type: string, format: email }
    UpdateSettingsRequest:
      type: object
      properties:
        organization:
          type: object
          properties:
            name: { type: string, maxLength: 64 }
        mail:
          type: object
          properties:
            enabled: { type: boolean }
            host: { type: string, maxLength: 255 }
            port: { type: integer, minimum: 1, maximum: 65535 }
            security: { type: string, enum: [tls, starttls] }
            username: { type: string, maxLength: 255 }
            password: { type: string, maxLength: 1024, description: Write-only. Absent keeps the current one. }
            from: { type: string, format: email }
    TestMailRequest:
      type: object
      required: [to]
      properties:
        to: { type: string, format: email }
    Module:
      type: object
      required: [id, name, description, enabled, locked]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        notice: { type: string, description: 'What turning it on means - data collected, systems contacted. Shown before it is turned on.' }
        locked: { type: boolean, description: Disabled by the deployment; cannot be turned on here. }
    ModuleList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Module' } }
    UpdateModuleRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }

    # -------------------------------------------------------------- adapters
    Adapter:
      type: object
      required: [id, name, enabled, people, targets]
      properties:
        id: { $ref: '#/components/schemas/ToolId' }
        name: { type: string, description: The tool's own name; not translated. }
        verified: { $ref: '#/components/schemas/Verification' }
        enabled: { type: boolean, description: 'The organisation-wide switch. An adapter without `verified` never writes anything, whatever this says.' }
        people: { type: integer, minimum: 0, description: People with this tool detected at their last sync. }
        targets:
          type: object
          description: Where each kind of artifact lands in this tool, by artifact kind (`skill`, `mcp`, `command`, `agent`, `hook`).
          additionalProperties: { $ref: '#/components/schemas/AdapterTarget' }
    Verification:
      type: object
      required: [version, at]
      properties:
        version: { type: string, description: The tool version the profile was checked against. }
        at: { type: string, format: date }
    AdapterTarget:
      type: object
      properties:
        location: { type: string, description: 'A display path such as `~/.claude/skills/`. Absent when the tool has no place for it.' }
        detail: { type: string, description: 'Where inside the file, such as `mcpServers`.' }
        fallback: { type: string, description: The artifact kind used instead when the tool has no place for this one. }
        opt_in: { type: boolean, description: Written only after the person agrees (hooks). }
    AdapterList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Adapter' } }
    UpdateAdapterRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }

    # ------------------------------------------------------------------- cli
    CLIPolicy:
      type: object
      required: [min_version, latest_version, min_version_floor, distribution]
      properties:
        min_version: { $ref: '#/components/schemas/SemVer' }
        latest_version: { $ref: '#/components/schemas/SemVer' }
        min_version_floor: { $ref: '#/components/schemas/SemVer' }
        distribution: { type: array, description: People by the command-line version of their most recent sync., items: { $ref: '#/components/schemas/VersionCount' } }
    UpdateCLIPolicyRequest:
      type: object
      required: [min_version]
      properties:
        min_version: { $ref: '#/components/schemas/SemVer' }
    CLIDownload:
      type: object
      required: [os, arch, file, url, sha256, size]
      properties:
        os: { type: string, enum: [darwin, linux, windows] }
        arch: { type: string, enum: [amd64, arm64] }
        file: { type: string }
        url: { type: string, format: uri }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        size: { type: integer, minimum: 0 }
    CLIDownloadList:
      type: object
      required: [version, install_sh, install_ps1, items]
      properties:
        version: { $ref: '#/components/schemas/SemVer' }
        install_sh: { type: string, format: uri }
        install_ps1: { type: string, format: uri }
        items: { type: array, items: { $ref: '#/components/schemas/CLIDownload' } }

