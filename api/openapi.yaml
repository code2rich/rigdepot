# Copyright 2026 The Rigdepot Authors
#
# The HTTP contract between the server, the command-line program and the web
# console. It is the only source of truth: change this file first, then run
#
#   go run ./tools/dev gen
#
# which regenerates internal/server/httpapi and internal/apiclient. A change
# to a /api/v1 path may only add (fields, operations, enumeration values);
# changing what something means needs /api/v2.
openapi: 3.0.3
info:
  title: Rigdepot API
  version: v1
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: |
    The server's HTTP interface, used by the web console (session cookie) and
    the command-line program (device token, or access token in CI).

    ## Conventions

    | Topic | Rule |
    | --- | --- |
    | Paths | `/api/v1/` + plural nouns in lower-case kebab-case. An action on an object is a `POST` to a sub-path named by a verb: `/resources/{code}/publish`. The only paths outside `/api/v1` are the ones the installer is fetched from (`/install.sh`, `/install.ps1`, `/downloads/…`). |
    | Identifiers | Resources by code, products by code, feedback by its number, versions by their number; everything else by its id (a UUIDv7 string). |
    | Fields | `snake_case`. Times are RFC 3339 in UTC. A field that has no value is left out rather than sent as `null`, unless the schema says otherwise. |
    | Lists | Every list is an object with `items`. Lists that grow without bound (audit, feedback, notifications, versions) are paginated: `?limit=&cursor=`, and the response carries `next_cursor` while there is more. Cursors are opaque. Lists bounded by the size of the organisation (resources, products, users…) come in one piece; pagination can be added later without breaking anyone, because the shape is the same. |
    | Concurrency | Objects people edit (a resource, its draft, platform settings, a resource source, an identity provider) carry a read-only `etag`, also sent as the `ETag` header. Changing them needs `If-Match` with that value: a mismatch is `412 precondition.failed`, a missing header `428 precondition.required`. Publishing is guarded by the **draft's** etag, so nobody publishes content they have not seen. |
    | Caching | `GET /api/v1/sync/desired` honours `If-None-Match` and answers `304` when nothing changed. Bundles are immutable and addressed by digest. |
    | Errors | `application/problem+json` (RFC 9457) with a stable `code` (`<area>.<reason>`), `params` to fill into a translated message, and the `request_id` that is also in the server log. `detail` is already rendered in the request's language. Clients branch on `code`, never on `detail`. |
    | Language | The signed-in person's setting, then `Accept-Language`, then the server default. Display names of stages, rules, actions and notifications come back translated. |
    | Compatibility | Within `/api/v1` the contract only grows. Clients ignore fields and enumeration values they do not know. |
    | Client identity | The command-line program sends `User-Agent: rgd/<version> (<os>; <arch>)`. When it acts on behalf of an AI tool it also sends `X-Via-Tool: <tool id>`, which ends up in the audit log. |

    ## Authentication

    Three credentials, one per kind of caller. They are listed per operation
    under `security`; an operation without its own list accepts a session or
    a device token.

    * **session** – the web console. A cookie set by the sign-in operations.
      Cross-site requests are refused by checking `Sec-Fetch-Site` and
      `Origin` on every unsafe method (Go's `http.CrossOriginProtection`) on
      top of `SameSite=Lax`, so there is no separate CSRF token to send.
    * **device** – the command-line program after `rgd login`. A bearer token
      starting with `rgdd_`, bound to one computer and its public key.
    * **accessToken** – programs such as CI. A bearer token starting with
      `rgd_`, with a scope and an expiry. Operations that accept it name the
      scope they need in `x-token-scope` (`read`, or `publish`, which
      includes `read`). What a token may do is its scope intersected with
      what the person who issued it may do at that moment.

    Permissions are checked by the server for every call; a client hiding a
    button is a convenience, not a control. A person whose account is not
    yet activated (status `pending`) can only read and edit their own
    profile, list products and stages, and ask to join products.

    ## Common errors

    Besides the responses listed per operation, any operation can answer with
    the problem document of its `default` response:

    | Status | `code` | When |
    | --- | --- | --- |
    | 400 | `request.invalid` | The request does not match this contract; `errors` lists the fields |
    | 401 | `auth.required` | No credential, or it expired or was revoked |
    | 403 | `access.denied` | Signed in, but not allowed to do this |
    | 404 | `object.not_found` | Not there, or not visible to the caller |
    | 413 | `request.too_large` | The body is over the limit, refused before it is read |
    | 429 | `rate.limited` | Too many attempts; `Retry-After` says when to try again |
    | 500 | `server.error` | A fault on the server; the `request_id` finds it in the log |
servers:
  - url: /
    description: The server's own address (RGD_BASE_URL); every path below is absolute.
security:
  - session: []
  - device: []
tags:
  - name: meta
    description: What the server is and how to sign in. Login page, console shell.
  - name: setup
    description: |
      The first-run wizard. Only the steps that cannot be done any other way
      live here: creating the first administrator (with the one-time setup
      token from the server log) and closing the wizard. The steps in
      between (sign-in methods, resource sources, data and privacy, first
      product) use the ordinary operations as that administrator. Once the
      wizard is complete, every operation in this group answers
      `404 setup.closed`.
  - name: auth
    description: Signing in and out in the browser, OIDC and GitLab, invitations.
  - name: me
    description: The signed-in person - profile, computers, access tokens, personal secrets, join requests, notifications. Home, keys and devices, apply.
  - name: device
    description: Device authorization (RFC 8628) for `rgd login`, and the confirmation page in the browser.
  - name: catalog
    description: Published resources the caller can see, their content, and turning them on or off for oneself. Home, catalog, resource details.
  - name: sync
    description: What the command-line program fetches and reports - desired state, bundles, sealed secrets, install results - and the install figures built from those reports.
  - name: resources
    description: Managing resources - drafts, uploads, check results, publishing, versions, rollback, disabling, impact. Resource management and its editing drawer.
  - name: sources
    description: Git repositories resources are imported from. Platform settings.
  - name: products
    description: Products, their members and owners, join requests. Products and members.
  - name: users
    description: Accounts, invitations and sign-in methods. Users and sign-in.
  - name: feedback
    description: The deployment's own feedback queue. Feedback page, the feedback button.
  - name: audit
    description: The append-only audit log. Audit page.
  - name: settings
    description: Platform settings and optional modules. Platform settings, setup wizard.
  - name: adapters
    description: The built-in tool adapters, their landing places and whether the organisation uses them. Tool adapters page.
  - name: cli
    description: Command-line versions the server accepts, and the installers and binaries it hands out on the internal network.
paths:
  # ------------------------------------------------------------------ meta
  /api/v1/meta:
    get:
      operationId: getMeta
      summary: Server version, sign-in methods, modules and setup state
      tags: [meta]
      security: [{}]
      responses:
        '200':
          description: What the console needs before anyone signs in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServerMeta' }
              example:
                version: 0.5.0
                api: v1
                organization: Example Corp
                setup_complete: true
                default_locale: en
                locales: [en, zh-CN]
                login_methods:
                  - { id: local, kind: local, name: Local account }
                  - { id: 0193a4b2-6c1e-7a00-8000-000000000101, kind: oidc, name: Company SSO }
                modules: []
                cli: { min_version: 0.4.0, latest_version: 0.5.0 }
                limits: { max_bundle_bytes: 5242880 }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/stages:
    get:
      operationId: listStages
      summary: The stages of the delivery process, in order
      tags: [catalog]
      security: [{ session: [] }, { device: [] }, { accessToken: [] }]
      x-token-scope: read
      responses:
        '200':
          description: Every stage, including hidden ones (marked), with translated names.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StageList' }
              example:
                items:
                  - { id: requirement, name: Requirements, hidden: false }
                  - { id: design, name: Design, hidden: false }
                  - { id: develop, name: Development, hidden: false }
                  - { id: test, name: Testing, hidden: false }
        default: { $ref: '#/components/responses/Problem' }

  # ----------------------------------------------------------------- setup
  /api/v1/setup:
    get:
      operationId: getSetup
      summary: Where the first-run wizard stands
      tags: [setup]
      security: [{}]
      responses:
        '200':
          description: The wizard is open.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupStatus' }
              example: { admin_created: false, setup_token_required: true }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/setup/admin:
    post:
      operationId: createSetupAdmin
      summary: Create the first administrator and sign them in
      description: |
        Needs the one-time setup token printed in the server log on first
        start (or given as RGD_SETUP_TOKEN). Creates a local account that is
        a platform administrator and starts a session for it, so the rest of
        the wizard runs as that administrator. Works once:
        `409 setup.admin_exists` afterwards. A wrong token is
        `403 setup.token_invalid` and counts towards the rate limit.
      tags: [setup]
      security: [{}]
      parameters:
        - { $ref: '#/components/parameters/SetupToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupAdminRequest' }
            example: { username: admin, display_name: Local administrator, password: '<placeholder: at least 12 characters>' }
      responses:
        '201':
          description: Created and signed in.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSession' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              example:
                id: 0193a4b2-6c1e-7a00-8000-000000000001
                username: admin
                display_name: Local administrator
                status: active
                platform_admin: true
                focus_stages: []
                locale: en
                memberships: []
        '409':
          description: The first administrator already exists (`setup.admin_exists`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: about:blank, title: Conflict, status: 409, code: setup.admin_exists, detail: The first administrator has already been created., request_id: 01JDV6ZQ8M3K }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/setup/complete:
    post:
      operationId: completeSetup
      summary: Close the wizard
      description: Invalidates the setup token and closes this group for good. Platform administrators only.
      tags: [setup]
      security: [{ session: [] }]
      responses:
        '204': { description: Closed. }
        default: { $ref: '#/components/responses/Problem' }

  # ------------------------------------------------------------------ auth
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Sign in with a local account
      description: |
        Failures are answered the same way whether the account exists or not
        (`401 auth.invalid_credentials`), are delayed progressively and end in
        a temporary lock (`429 auth.locked`). Every attempt is audited.
      tags: [auth]
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { username: jdoe, password: '<placeholder: password>' }
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSession' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              examples: { member: { $ref: '#/components/examples/MeMember' } }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Sign out of this browser
      tags: [auth]
      security: [{ session: [] }]
      responses:
        '204':
          description: The session is gone and the cookie cleared.
          headers:
            Set-Cookie: { $ref: '#/components/headers/ClearSession' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/auth/providers/{provider_id}/start:
    get:
      operationId: startProviderLogin
      summary: Start signing in with OIDC or GitLab
      description: |
        A browser navigation, not an API call. Sets a short-lived encrypted
        cookie with the state, nonce and PKCE verifier and redirects to the
        identity provider.
      tags: [auth]
      security: [{}]
      parameters:
        - { $ref: '#/components/parameters/ProviderId' }
        - name: return_to
          in: query
          description: A path on this server to come back to afterwards. Anything else is ignored.
          schema: { type: string, example: /catalog }
      responses:
        '302':
          description: Off to the identity provider.
          headers:
            Location: { $ref: '#/components/headers/Location' }
            Set-Cookie: { description: The encrypted login state., schema: { type: string } }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/auth/providers/{provider_id}/callback:
    get:
      operationId: finishProviderLogin
      summary: Come back from OIDC or GitLab
      description: |
        A browser navigation. Any failure refuses the login and redirects to
        `/login?error=<code>`. A known identity signs in; an unknown one with
        a verified e-mail address that matches an account is linked to it; anyone
        else gets a new account in status `pending` and lands on `/apply`.
      tags: [auth]
      security: [{}]
      parameters:
        - { $ref: '#/components/parameters/ProviderId' }
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, description: Set by the provider when the person declined., schema: { type: string } }
      responses:
        '302':
          description: Back into the console (or to the login page with an error code).
          headers:
            Location: { $ref: '#/components/headers/Location' }
            Set-Cookie: { $ref: '#/components/headers/SetSession' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/auth/invites/{invite_token}:
    get:
      operationId: getInvite
      summary: What an invitation link is for
      tags: [auth]
      security: [{}]
      parameters:
        - { $ref: '#/components/parameters/InviteToken' }
      responses:
        '200':
          description: The invitation is valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitePreview' }
              example:
                email: new.colleague@example.com
                products: [{ code: shop, name: Shop }]
                expires_at: '2026-12-02T09:00:00Z'
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/auth/invites/{invite_token}/accept:
    post:
      operationId: acceptInvite
      summary: Accept an invitation, set a password and sign in
      description: The link works once and for seven days (`410 invite.expired` afterwards).
      tags: [auth]
      security: [{}]
      parameters:
        - { $ref: '#/components/parameters/InviteToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInviteRequest' }
            example: { username: ncolleague, display_name: New Colleague, password: '<placeholder: at least 12 characters>' }
      responses:
        '201':
          description: The account exists and is signed in.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSession' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              examples: { member: { $ref: '#/components/examples/MeMember' } }
        '410':
          description: Used or expired (`invite.expired`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: about:blank, title: Gone, status: 410, code: invite.expired, detail: This invitation has expired. Ask for a new one., request_id: 01JDV6ZQ8M3K }
        default: { $ref: '#/components/responses/Problem' }

  # -------------------------------------------------------------------- me
  /api/v1/me:
    get:
      operationId: getMe
      summary: The signed-in person
      tags: [me]
      responses:
        '200':
          description: Profile, memberships and platform role.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              examples: { member: { $ref: '#/components/examples/MeMember' } }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateMe
      summary: Change one's own profile
      description: Job and focus stages decide what the home page shows first and which notifications arrive. They grant nothing.
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
            example: { job: Developer, focus_stages: [design, develop], locale: en }
      responses:
        '200':
          description: The updated profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
              examples: { member: { $ref: '#/components/examples/MeMember' } }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/me/devices:
    get:
      operationId: listMyDevices
      summary: The computers signed in as me
      tags: [me]
      responses:
        '200':
          description: Active computers, most recently seen first. What the command line last reported, without any file path.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceList' }
              example:
                items:
                  - id: 0193a4b2-6c1e-7a00-8000-000000000201
                    name: dev-laptop
                    os: darwin
                    arch: arm64
                    cli_version: 0.5.0
                    key_storage: keyring
                    current: true
                    created_at: '2026-11-02T08:10:00Z'
                    last_seen_at: '2026-11-25T09:37:00Z'
                    last_sync: { at: '2026-11-25T09:37:00Z', result: ok, changes: 0 }
                    tools:
                      - { tool: claude-code, version: 2.1.330 }
                      - { tool: codex, version: 0.167.1 }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/me/devices/{device_id}:
    delete:
      operationId: signOutDevice
      summary: Sign a computer out
      description: Its device token stops working with the next request. `rgd logout` calls this for its own computer.
      tags: [me]
      parameters:
        - { $ref: '#/components/parameters/DeviceId' }
      responses:
        '204': { description: Signed out. }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/me/sign-out-all:
    post:
      operationId: signOutEverywhere
      summary: Sign out every computer and every browser, this one included
      tags: [me]
      responses:
        '204':
          description: Every session and device token of mine is revoked.
          headers:
            Set-Cookie: { $ref: '#/components/headers/ClearSession' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/me/tokens:
    get:
      operationId: listMyAccessTokens
      summary: My access tokens
      tags: [me]
      responses:
        '200':
          description: Active and expired tokens; revoked ones are left out.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessTokenList' }
              example:
                items:
                  - { id: 0193a4b2-6c1e-7a00-8000-000000000301, name: CI pipeline, prefix: rgd_Qm4x, scope: read, created_at: '2026-10-01T08:00:00Z', expires_at: '2026-12-30T08:00:00Z', last_used_at: '2026-11-24T22:15:00Z' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createAccessToken
      summary: Issue an access token
      description: The plain token is in this response and nowhere else, ever. Only from the browser.
      tags: [me]
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccessTokenRequest' }
            example: { name: CI pipeline, scope: read, expires_in_days: 90 }
      responses:
        '201':
          description: Issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedAccessToken' }
              example:
                token: '<placeholder: rgd_ token, shown once>'
                access_token: { id: 0193a4b2-6c1e-7a00-8000-000000000301, name: CI pipeline, prefix: rgd_Qm4x, scope: read, created_at: '2026-11-25T10:00:00Z', expires_at: '2027-02-23T10:00:00Z' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/me/tokens/{token_id}:
    delete:
      operationId: revokeAccessToken
      summary: Revoke an access token
      tags: [me]
      parameters:
        - { $ref: '#/components/parameters/TokenId' }
      responses:
        '204': { description: Revoked; programs using it are refused from now on. }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/me/secrets:
    get:
      operationId: listMySecrets
      summary: The personal secrets resources ask me for
      description: Whether each is configured and until when. No operation returns a value.
      tags: [me]
      responses:
        '200':
          description: Every secret a resource visible to me refers to.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MySecretList' }
              example:
                items:
                  - name: JIRA_API_TOKEN
                    label: Jira API token
                    howto: Jira, Account settings, Security, API tokens
                    used_by: [{ code: jira, kind: mcp, name: Jira }]
                    configured: true
                    updated_at: '2026-10-20T08:00:00Z'
                    expires_at: '2026-11-30T00:00:00Z'
                  - name: FIGMA_TOKEN
                    label: Figma personal access token
                    howto: Figma, Settings, Security, Personal access tokens
                    used_by: [{ code: figma, kind: mcp, name: Figma }]
                    configured: false
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/me/secrets/{secret_name}:
    put:
      operationId: setMySecret
      summary: Set or replace one of my secrets
      description: |
        Write-only: the value is encrypted at once and never returned, not
        even to its owner. Only from the browser or one's own terminal
        (`rgd secret set`), never through an access token. The audit log
        records that it was replaced, not the value. Each computer gets the
        new value at its next sync.
      tags: [me]
      parameters:
        - { $ref: '#/components/parameters/SecretName' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetSecretRequest' }
            example: { value: '<placeholder: your token>', expires_at: '2027-05-01T00:00:00Z' }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MySecret' }
              example:
                name: FIGMA_TOKEN
                label: Figma personal access token
                howto: Figma, Settings, Security, Personal access tokens
                used_by: [{ code: figma, kind: mcp, name: Figma }]
                configured: true
                updated_at: '2026-11-25T10:00:00Z'
                expires_at: '2027-05-01T00:00:00Z'
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteMySecret
      summary: Delete one of my secrets
      description: Each computer drops its copy at the next sync; MCP servers that need it fall back to on-demand delivery.
      tags: [me]
      parameters:
        - { $ref: '#/components/parameters/SecretName' }
      responses:
        '204': { description: Deleted. }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/me/join-requests:
    get:
      operationId: listMyJoinRequests
      summary: My requests to join products
      tags: [me]
      responses:
        '200':
          description: Newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinRequestList' }
              example:
                items:
                  - id: 0193a4b2-6c1e-7a00-8000-000000000501
                    user: { id: 0193a4b2-6c1e-7a00-8000-000000000012, username: wyan, display_name: Wen Yan }
                    product: { code: shop, name: Shop }
                    note: Joining the shop backend team
                    status: pending
                    created_at: '2026-11-25T10:26:00Z'
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createJoinRequests
      summary: Ask to join one or more products
      description: One request per product, each reviewed by that product's owners. Until one is approved nothing of that product is visible.
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateJoinRequestsRequest' }
            example: { products: [shop, pay], note: Joining the shop backend team }
      responses:
        '201':
          description: The requests, one per product.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinRequestList' }
