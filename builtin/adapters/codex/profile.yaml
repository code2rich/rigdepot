#
# Codex. Where it keeps things, and how that was checked:
# docs/architecture/04a-platforms.md in the design repository, section "Codex".
#
# Skills live in ~/.agents/skills and do not follow CODEX_HOME: the tool's source takes them from
# the home directory. $CODEX_HOME/skills is the deprecated location, still read, never written.
# Codex has no slash commands of its own any more (custom prompts are deprecated in favour of
# skills) and no sub-agent files we could verify, so workflows and agents arrive as skills.
#
# What the profile cannot say, and the adapter's code does: the MCP entry's TOML shape
# (bearer_token_env_var and env_http_headers for secrets), and an mcp_servers that is written as
# an inline table, which cannot be extended without rewriting it.
id: codex
name: Codex
detect:
  bins: [codex]
  dirs: ["{config}"]
  # Prints "codex-cli 0.167.1".
  version: { run: [codex, --version], match: 'codex-cli (\d+\.\d+\.\d+)' }
roots:
  config: { env: CODEX_HOME, default: "~/.codex" }
verified:
  version: "0.167.1"
  os: [darwin]
  at: "2026-11-24"
  how: >-
    ran codex mcp add in a temporary home directory and read the config.toml it wrote, then
    codex mcp list read our entry back; the skills location from the official documentation and
    codex-rs/ext/skills/src/host_roots.rs
skills: { dir: "~/.agents/skills", layout: dir }
mcp:
  files: ["{config}/config.toml"]
  format: toml
  path: [mcp_servers]
credentials: [auth.json]
