#
# Codex. Where it keeps things, and how that was checked:
# docs/architecture/04a-platforms.md in the design repository, section "Codex".
#
# Skills live in ~/.agents/skills and do not follow CODEX_HOME: the tool's source takes them from
# the home directory. $CODEX_HOME/skills is the deprecated location, still read, never written.
# Codex has no slash commands of its own any more (custom prompts are deprecated in favour of
# skills) and no sub-agent files we could verify, so workflows and agents arrive as skills.
#
# What the profile cannot say, and the adapter's code does (adapter.go, config.go): reading
# config.toml, the MCP entry's own TOML shape (no "type"; env_vars, bearer_token_env_var and
# env_http_headers for secrets), and an mcp_servers that is written as an inline table, which
# cannot be extended without rewriting it.
id: codex
name: Codex
detect:
  bins: [codex]
  dirs: ["{config}"]
  # Prints "codex-cli 0.167.1".
  version: { run: [codex, --version], match: 'codex-cli (\d+\.\d+\.\d+)' }
roots:
  config: { env: CODEX_HOME, default: "~/.codex" }
verified:
  version: "0.172.0"
  os: [darwin]
  at: "2026-11-25"
  how: >-
    with HOME and CODEX_HOME pointing into a temporary directory, ran codex mcp add (stdio with
    --env, HTTP with --bearer-token-env-var) and read the config.toml it wrote; wrote entries with
    env_vars, http_headers and env_http_headers and the entries of this adapter's golden files,
    and codex mcp list --json read every field back (0.167.1 on 2026-11-24 for the first part);
    a byte order mark, CRLF and an inline mcp_servers table are accepted by Codex; the skills
    location from the official documentation (user skills in $HOME/.agents/skills) and
    codex-rs/ext/skills/src/host_roots.rs
skills: { dir: "~/.agents/skills", layout: dir }
mcp:
  files: ["{config}/config.toml"]
  format: toml
  path: [mcp_servers]
credentials: [auth.json]
