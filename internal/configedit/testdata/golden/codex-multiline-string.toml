model = "example-model"
developer_instructions = """
Never touch these sections:
[mcp_servers.docs]
[mcp_servers.tracker]
"""

[mcp_servers.docs]
command = "npx" # the docs server
args = ['-y', '@example/docs-mcp']

[mcp_servers.rgd-jira]
args = ["mcp", "run", "jira"]
command = "/opt/example/bin/rgd"

[mcp_servers.rgd-jira.env]
JIRA_URL = "https://jira.example.com"
