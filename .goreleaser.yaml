# Copyright 2026 The Rigdepot Authors
#
# Release configuration. Run it through the development entry point, which
# uses the goreleaser version pinned in tools/release.mod:
#
#   go run ./tools/dev release-snapshot    build everything into dist/, publish nothing,
#                                          build again elsewhere and compare the checksums,
#                                          install from dist/ with scripts/install.sh
#
# Only features of the open-source edition of goreleaser are used.
#
# Switches, all set by tools/dev; running goreleaser by hand gets the defaults:
#
#   RELEASE_WEBDIST=0        build rgd-server without the web console (default: with it,
#                            which needs web/dist from "go run ./tools/dev web")
#   RELEASE_SBOM=1           write an SPDX SBOM next to every archive (needs syft on PATH)
#   PACKAGES_GITHUB_TOKEN    a token that can push to the Homebrew tap and the Scoop bucket;
#                            without it the cask and the manifest are only written into dist/

version: 2
project_name: rigdepot

before:
  hooks:
    # Generated files must be up to date.
    - go run ./tools/dev gen --check
    # Shell completions and third-party notices for the archives, into .dev/release/.
    - go run ./tools/dev release-files

# A build that is not a release shows as 0.0.0-dev+<commit>, so that it
# cannot be mistaken for one.
snapshot:
  version_template: "0.0.0-dev+{{ .ShortCommit }}"

builds:
  # The command-line program: six targets, no cgo.
  - id: rgd
    main: ./cmd/rgd
    binary: rgd
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # -buildvcs=false: the version, commit and commit time come in through
    # ldflags. Left to itself, go build also records the VCS state, and only
    # where it can read it: a build in a git worktree and one in a clone of the
    # same commit came out different.
    flags: [-trimpath, -buildvcs=false]
    ldflags: &ldflags
      - -s -w
      - -X github.com/code2rich/rigdepot/internal/buildinfo.Version={{ .Version }}
      - -X github.com/code2rich/rigdepot/internal/buildinfo.Commit={{ .FullCommit }}
      - -X github.com/code2rich/rigdepot/internal/buildinfo.Date={{ .CommitDate }}
    # Reproducible: the same commit gives the same bytes on any machine.
    mod_timestamp: "{{ .CommitTimestamp }}"

  # The server: Linux only, with the web console embedded ("webdist"; web/dist
  # must have been built first).
  - id: rgd-server
    main: ./cmd/rgd-server
    binary: rgd-server
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath, -buildvcs=false]
    tags:
      - '{{ if ne (envOrDefault "RELEASE_WEBDIST" "1") "0" }}webdist{{ end }}'
    ldflags: *ldflags
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: rgd
    ids: [rgd]
    name_template: "rgd_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Fixed owner and time stamps: an archive must not depend on who built it
    # or when.
    files:
      - src: LICENSE
        info: &file_info { owner: root, group: root, mtime: "{{ .CommitDate }}" }
      - src: NOTICE
        info: *file_info
      - src: .dev/release/THIRD_PARTY_NOTICES
        dst: THIRD_PARTY_NOTICES
        info: *file_info
      - src: .dev/release/completions/*
        dst: completions
        strip_parent: true
        info: *file_info
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"

  - id: rgd-server
    ids: [rgd-server]
    name_template: "rgd-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - src: LICENSE
        info: *file_info
      - src: NOTICE
        info: *file_info
      - src: .dev/release/THIRD_PARTY_NOTICES
        dst: THIRD_PARTY_NOTICES
        info: *file_info
      - src: deploy/systemd/rigdepot-server.service
        info: *file_info
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"

# The server as Debian and RPM packages, one per architecture: rgd-server, the
# systemd unit, a system user and its data directory, the startup
# configuration, and the six rgd archives of this release for the server to
# hand out on the internal network (docs: 08-deployment). The packages come
# after the archives in goreleaser's pipeline, so the archives are in dist/.
nfpms:
  - id: rigdepot-server
    ids: [rgd-server]
    package_name: rigdepot-server
    # rigdepot-server_0.4.0_amd64.deb, rigdepot-server-0.4.0-1.x86_64.rpm
    file_name_template: "{{ .ConventionalFileName }}"
    formats: [deb, rpm]
    vendor: The Rigdepot Authors
    homepage: https://github.com/code2rich/rigdepot
    maintainer: The Rigdepot Authors <rigdepot@code2rich.com>
    description: |-
      Rigdepot server.
      One depot for your team's AI coding rig: the catalogue, the web console
      and the command line it hands out to the team's computers.
    license: Apache-2.0
    section: net
    priority: optional
    bindir: /usr/bin
    # Fixed time stamps: a package must not depend on when it was built.
    mtime: "{{ .CommitDate }}"
    # git fetches the resource repositories; useradd makes the system user.
    dependencies: [git]
    overrides:
      deb:
        dependencies: [git, passwd]
        recommends: [openssh-client, ca-certificates]
      rpm:
        dependencies: [git, shadow-utils]
        recommends: [openssh-clients, ca-certificates]
    contents:
      - src: deploy/systemd/rigdepot-server.service
        dst: /usr/lib/systemd/system/rigdepot-server.service
        file_info: { mode: 0644, mtime: "{{ .CommitDate }}" }
      - dst: /etc/rigdepot
        type: dir
        file_info: { mode: 0755, mtime: "{{ .CommitDate }}" }
      - src: deploy/packaging/server.env
        dst: /etc/rigdepot/server.env
        type: config|noreplace
        file_info: { mode: 0600, mtime: "{{ .CommitDate }}" }
      - dst: /var/lib/rigdepot
        type: dir
        file_info: { mode: 0700, mtime: "{{ .CommitDate }}" }
      - src: "dist/rgd_{{ .Version }}_*.tar.gz"
        dst: /usr/share/rigdepot/cli/
        file_info: { mode: 0644, mtime: "{{ .CommitDate }}" }
      - src: "dist/rgd_{{ .Version }}_*.zip"
        dst: /usr/share/rigdepot/cli/
        file_info: { mode: 0644, mtime: "{{ .CommitDate }}" }
      - src: LICENSE
        dst: /usr/share/doc/rigdepot-server/LICENSE
        file_info: { mode: 0644, mtime: "{{ .CommitDate }}" }
      - src: NOTICE
        dst: /usr/share/doc/rigdepot-server/NOTICE
        file_info: { mode: 0644, mtime: "{{ .CommitDate }}" }
      - src: .dev/release/THIRD_PARTY_NOTICES
        dst: /usr/share/doc/rigdepot-server/THIRD_PARTY_NOTICES
        file_info: { mode: 0644, mtime: "{{ .CommitDate }}" }
    scripts:
      preinstall: deploy/packaging/preinstall.sh
      postinstall: deploy/packaging/postinstall.sh
      preremove: deploy/packaging/preremove.sh
      postremove: deploy/packaging/postremove.sh

checksum:
  name_template: checksums.txt
  algorithm: sha256
  # The install scripts are release files too: a mirror serves them next to the
  # archives, and someone who reads one before running it can check it.
  extra_files:
    - glob: scripts/install.sh
    - glob: scripts/install.ps1

# A software bill of materials in SPDX for every archive, made by syft
# (docs: 10-release, third-party notices). Off unless RELEASE_SBOM=1, because
# syft is not something every machine has; tools/dev turns it on when it finds
# syft and reports it as not run when it does not.
sboms:
  - id: archives
    artifacts: archive
    disable: '{{ if eq (envOrDefault "RELEASE_SBOM" "0") "1" }}false{{ else }}true{{ end }}'

# Signing: not enabled yet.
#
# The plan is to sign checksums.txt, and only that file, with an SSH key
# ("ssh-keygen -Y sign"), so that anyone can verify a release with a tool
# that macOS, Linux and Windows already ship. It waits for the release key to
# be created and its public half to be published in SECURITY.md. Then:
#
# signs:
#   - artifacts: checksum
#     cmd: ssh-keygen
#     args: ["-Y", "sign", "-f", "{{ .Env.RELEASE_SIGNING_KEY }}", "-n", "file", "${artifact}"]
#     signature: "${artifact}.sig"
#
# macOS notarization: not enabled yet.
#
# Without it, a binary downloaded with a browser is stopped by Gatekeeper on
# first run; one downloaded by the install script is not. It needs an Apple
# Developer account, a "Developer ID Application" certificate and an App Store
# Connect API key, and can then run on Linux as well:
#
# notarize:
#   macos:
#     - enabled: true
#       ids: [rgd]
#       sign: { certificate: "{{ .Env.MACOS_SIGN_P12 }}", password: "{{ .Env.MACOS_SIGN_PASSWORD }}" }
#       notarize: { issuer_id: "...", key_id: "...", key: "{{ .Env.MACOS_NOTARY_KEY }}" }
#
# Windows code signing comes last; until then Windows users install with Scoop
# or the install script, which do not trigger SmartScreen.

# Package managers: a Homebrew tap (code2rich/homebrew-tap) and a Scoop bucket
# (code2rich/scoop-bucket). The release's own token can only write to this
# repository, so pushing to those two takes PACKAGES_GITHUB_TOKEN: a token with
# write access to their contents. Without it, and always for a pre-release
# ("auto"), the cask and the manifest are only written into dist/.
homebrew_casks:
  - name: rigdepot
    ids: [rgd]
    binaries: [rgd]
    homepage: https://github.com/code2rich/rigdepot
    description: One depot for your team's AI coding rig
    repository:
      owner: code2rich
      name: homebrew-tap
      token: "{{ .Env.PACKAGES_GITHUB_TOKEN }}"
    skip_upload: '{{ if isEnvSet "PACKAGES_GITHUB_TOKEN" }}auto{{ else }}true{{ end }}'
    # Written by tools/dev release-files and packed into every archive.
    completions:
      bash: completions/rgd.bash
      zsh: completions/_rgd
      fish: completions/rgd.fish
    # Homebrew marks what a cask downloads as quarantined, and Gatekeeper then
    # stops a binary that is not notarized. Until releases are notarized, the
    # cask removes the mark from the one file it installed. Delete this hook
    # together with enabling notarization above.
    #
    # This is the spelling goreleaser v2.14 understands. From v2.19 on it is
    # deprecated in favour of "install_steps" with Homebrew's declarative
    # steps (run instead of system_command, on_macos instead of OS.mac?);
    # rewrite it when the pinned goreleaser is upgraded.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/rgd"]
          end

scoops:
  - name: rigdepot
    ids: [rgd]
    homepage: https://github.com/code2rich/rigdepot
    description: One depot for your team's AI coding rig
    license: Apache-2.0
    repository:
      owner: code2rich
      name: scoop-bucket
      token: "{{ .Env.PACKAGES_GITHUB_TOKEN }}"
    skip_upload: '{{ if isEnvSet "PACKAGES_GITHUB_TOKEN" }}auto{{ else }}true{{ end }}'

release:
  github:
    owner: code2rich
    name: rigdepot
  # A tag such as v0.4.0-rc.1 is published as a pre-release and never becomes
  # "latest".
  prerelease: auto
  extra_files:
    - glob: scripts/install.sh
    - glob: scripts/install.ps1

changelog:
  sort: asc
  filters:
    exclude:
      - "^merge:"
