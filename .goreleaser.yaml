# Copyright 2026 The Rigdepot Authors
#
# Release configuration. Run it through the development entry point, which
# uses the goreleaser version pinned in tools/release.mod:
#
#   go run ./tools/dev release-snapshot    build everything into dist/, publish nothing
#
# Only features of the open-source edition of goreleaser are used.

version: 2
project_name: rigdepot

before:
  hooks:
    # Generated files must be up to date.
    - go run ./tools/dev gen --check

# A build that is not a release shows as 0.0.0-dev+<commit>, so that it
# cannot be mistaken for one.
snapshot:
  version_template: "0.0.0-dev+{{ .ShortCommit }}"

builds:
  # The command-line program: six targets, no cgo.
  - id: rgd
    main: ./cmd/rgd
    binary: rgd
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: &ldflags
      - -s -w
      - -X github.com/code2rich/rigdepot/internal/buildinfo.Version={{ .Version }}
      - -X github.com/code2rich/rigdepot/internal/buildinfo.Commit={{ .FullCommit }}
      - -X github.com/code2rich/rigdepot/internal/buildinfo.Date={{ .CommitDate }}
    # Reproducible: the same commit gives the same bytes on any machine.
    mod_timestamp: "{{ .CommitTimestamp }}"

  # The server: Linux only. Once the web console exists it is built first and
  # embedded with the "webdist" build tag.
  - id: rgd-server
    main: ./cmd/rgd-server
    binary: rgd-server
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: *ldflags
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: rgd
    ids: [rgd]
    name_template: "rgd_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Fixed owner and time stamps: an archive must not depend on who built it
    # or when.
    files:
      - src: LICENSE
        info: &file_info { owner: root, group: root, mtime: "{{ .CommitDate }}" }
      - src: NOTICE
        info: *file_info
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"

  - id: rgd-server
    ids: [rgd-server]
    name_template: "rgd-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - src: LICENSE
        info: *file_info
      - src: NOTICE
        info: *file_info
      - src: deploy/systemd/rigdepot-server.service
        info: *file_info
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Signing: not enabled yet.
#
# The plan is to sign checksums.txt, and only that file, with an SSH key
# ("ssh-keygen -Y sign"), so that anyone can verify a release with a tool
# that macOS, Linux and Windows already ship. It waits for the release key to
# be created and its public half to be published in SECURITY.md. Then:
#
# signs:
#   - artifacts: checksum
#     cmd: ssh-keygen
#     args: ["-Y", "sign", "-f", "{{ .Env.RELEASE_SIGNING_KEY }}", "-n", "file", "${artifact}"]
#     signature: "${artifact}.sig"
#
# macOS notarization: not enabled yet.
#
# Without it, a binary downloaded with a browser is stopped by Gatekeeper on
# first run; one downloaded by the install script is not. It needs an Apple
# Developer account, a "Developer ID Application" certificate and an App Store
# Connect API key, and can then run on Linux as well:
#
# notarize:
#   macos:
#     - enabled: true
#       ids: [rgd]
#       sign: { certificate: "{{ .Env.MACOS_SIGN_P12 }}", password: "{{ .Env.MACOS_SIGN_PASSWORD }}" }
#       notarize: { issuer_id: "...", key_id: "...", key: "{{ .Env.MACOS_NOTARY_KEY }}" }
#
# Windows code signing comes last; until then Windows users install with Scoop
# or the install script, which do not trigger SmartScreen.

# Package managers. Both write into repositories that do not exist yet
# (code2rich/homebrew-tap, code2rich/scoop-bucket), so nothing is uploaded:
# the files are only generated into dist/ for review. Create the repositories,
# give the release a token that can push to them, then remove skip_upload.
homebrew_casks:
  - name: rigdepot
    ids: [rgd]
    binaries: [rgd]
    homepage: https://github.com/code2rich/rigdepot
    description: One depot for your team's AI coding rig
    repository:
      owner: code2rich
      name: homebrew-tap
    skip_upload: true
    # Homebrew marks what a cask downloads as quarantined, and Gatekeeper then
    # stops a binary that is not notarized. Until releases are notarized, the
    # cask removes the mark from the one file it installed. Delete this hook
    # together with enabling notarization above.
    #
    # This is the spelling goreleaser v2.14 understands. From v2.19 on it is
    # deprecated in favour of "install_steps" with Homebrew's declarative
    # steps (run instead of system_command, on_macos instead of OS.mac?);
    # rewrite it when the pinned goreleaser is upgraded.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/rgd"]
          end

scoops:
  - name: rigdepot
    ids: [rgd]
    homepage: https://github.com/code2rich/rigdepot
    description: One depot for your team's AI coding rig
    license: Apache-2.0
    repository:
      owner: code2rich
      name: scoop-bucket
    skip_upload: true

release:
  github:
    owner: code2rich
    name: rigdepot
  # A tag such as v0.4.0-rc.1 is published as a pre-release and never becomes
  # "latest".
  prerelease: auto
  extra_files:
    - glob: scripts/install.sh
    - glob: scripts/install.ps1

changelog:
  sort: asc
  filters:
    exclude:
      - "^merge:"
