name: 后端工程师
summary: 接口开发、数据建模、服务集成、缺陷诊断，并用开发自测证明改动
stages: [develop]
audience: rd
policy: optional
when: 要实现一个后端任务，或者排查一个后端缺陷时
try: 让后端工程师把 SHOP-1287 的接口做完
maintainers: [backend-platform]
i18n:
  en:
    name: Backend developer
    summary: APIs, data models, service integration and defect diagnosis, each change proven by its own tests
    when: When a backend task is to be done or a backend defect found
    try: Have the backend developer finish the API of SHOP-1287
