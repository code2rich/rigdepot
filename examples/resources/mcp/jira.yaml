meta:
  name: Jira
  summary: 读写需求、任务和缺陷，查询迭代计划
  stages: [requirement, develop, test]
  audience: rd
  policy: required
  when: 要查或者改需求、任务、缺陷时
  try: 查一下我这个迭代还没完成的任务

server:
  type: http
  url: https://jira.example.com/mcp
  headers:
    Authorization: "Bearer ${secret:JIRA_API_TOKEN}"

delivery: native

tools:
  - { name: search_issues, summary: 按 JQL 查询事项 }
  - { name: create_issue, summary: 新建事项, writes: true }
