meta:
  name: GitLab
  summary: 查询仓库、合并请求和流水线
  stages: [develop, scm]
  when: 要看合并请求、流水线状态或者仓库文件时
  try: 看一下我名下还没合并的合并请求

server:
  type: stdio
  command: npx
  args: ["-y", "@example/gitlab-mcp@1.4.2"]
  env:
    GITLAB_TOKEN: "${secret:GITLAB_TOKEN}"
    GITLAB_URL: https://gitlab.example.com

delivery: native
